---
name: PR catchup

# Merges main into each open, unapproved, non-conflicting pull request branch from
# this repository.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write # approving the runs a catch-up merge leaves awaiting approval
  contents: write # merging main into a branch through repos/{repo}/merges
  pull-requests: read # gh pr list and gh pr view

concurrency:
  group: pr-catchup
  cancel-in-progress: false

jobs:
  catchup:
    if: >-
      github.event_name != 'workflow_dispatch'
      || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the approve action
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions/approve-bot-gated-runs
          sparse-checkout-cone-mode: false

      - name: Update behind pull request branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          state_dir="${PR_CATCHUP_DIR:-/tmp}"

          : > "$state_dir/pr-catchup-updated.txt"
          gh pr list --repo "$REPO" --state open --base main --limit 100 \
            --json number,headRefName,isCrossRepository,mergeable,reviewDecision \
            --jq '.[] | select(.isCrossRepository == false
              and .mergeable != "CONFLICTING"
              and .reviewDecision != "APPROVED")
              | "\(.number) \(.headRefName)"' \
          | while read -r num branch; do
              echo "::group::PR #$num"
              # POST /repos/{repo}/merges, unlike update-branch, lets the merge
              # commit take a conventional subject. A branch already current gets
              # 204 and no body, so the SHA reads empty.
              err="$state_dir/pr-catchup-merge.err"
              if sha="$(gh api --method POST "repos/$REPO/merges" \
                -f base="$branch" -f head=main \
                -f commit_message="chore: merge main into #$num" \
                --jq '.sha // empty' 2>"$err")"; then
                if [ -n "$sha" ]; then
                  echo "updated #$num to $sha"
                  echo "$num $sha" >> "$state_dir/pr-catchup-updated.txt"
                else
                  echo "no update needed for #$num"
                fi
              else
                # The next push to main retries. A 409 is a conflict the listing
                # let through while mergeable read UNKNOWN.
                echo "::warning::merging main into #$num failed; the next push to main retries"
                cat "$err"
              fi
              echo "::endgroup::"
            done

      - name: Approve the runs this catch-up caused
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          action_dir="${GITHUB_WORKSPACE}/.github/actions/approve-bot-gated-runs"
          source "$action_dir/approve-bot-gated-runs.sh"

          state_dir="${PR_CATCHUP_DIR:-/tmp}"

          : > "$state_dir/pr-catchup-gated.txt"
          : > "$state_dir/pr-catchup-silent.txt"
          : > "$state_dir/pr-catchup-blind.txt"
          if [ ! -s "$state_dir/pr-catchup-updated.txt" ]; then
            echo "no branch was updated, so there is nothing to approve"
            exit 0
          fi

          while read -r num sha; do
            echo "::group::PR #$num at $sha"

            APPROVE_BOT_GATED_OUT="$state_dir/pr-catchup-gated-$num.txt"
            rc=0
            approve_bot_gated_runs_for_sha "$sha" "$num" || rc=$?
            if [ "$rc" = "2" ]; then
              echo "$num $sha" >> "$state_dir/pr-catchup-silent.txt"
            elif [ "$rc" != "0" ]; then
              if [ -s "$APPROVE_BOT_GATED_OUT" ]; then
                while read -r id; do
                  echo "$id $num" >> "$state_dir/pr-catchup-gated.txt"
                done < "$APPROVE_BOT_GATED_OUT"
              else
                # Runs are still held but the lookup named none: unverified, not gated.
                echo "$num $sha" >> "$state_dir/pr-catchup-blind.txt"
              fi
            fi

            echo "::endgroup::"
          done < "$state_dir/pr-catchup-updated.txt"

      - name: Fail if any caused run is still awaiting approval
        env:
          REPO: ${{ github.repository }}
        run: |
          stalled=0
          state_dir="${PR_CATCHUP_DIR:-/tmp}"

          if [ -s "$state_dir/pr-catchup-gated.txt" ]; then
            stalled=1
            while read -r id num; do
              echo "::error::run $id for PR #$num is still awaiting approval:"
              echo "  gh api --method POST repos/$REPO/actions/runs/$id/approve"
            done < "$state_dir/pr-catchup-gated.txt"
            echo "If this recurs, GITHUB_TOKEN cannot approve runs here."
          fi

          if [ -s "$state_dir/pr-catchup-silent.txt" ]; then
            stalled=1
            while read -r num sha; do
              echo "::error::no pull_request run appeared for PR #$num at $sha; approve any" \
                "held run, or push to the branch:"
              echo "  gh api repos/$REPO/actions/runs?head_sha=$sha"
            done < "$state_dir/pr-catchup-silent.txt"
          fi

          if [ -s "$state_dir/pr-catchup-blind.txt" ]; then
            stalled=1
            while read -r num sha; do
              echo "::error::the run lookup failed for PR #$num at $sha; approve anything" \
                "held there:"
              echo "  gh api repos/$REPO/actions/runs?head_sha=$sha"
            done < "$state_dir/pr-catchup-blind.txt"
          fi

          if [ "$stalled" = "0" ]; then
            echo "every run this catch-up caused is past the approval gate"
            exit 0
          fi
          exit 1
