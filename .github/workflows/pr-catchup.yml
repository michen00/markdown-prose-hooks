---
name: PR catchup

# Keep open pull request branches current with main. On every push to main (and
# on demand), update any open, same-repository, conflict-free pull request that
# has fallen behind, by merging main into it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: pr-catchup
  cancel-in-progress: false

jobs:
  catchup:
    if: >-
      github.event_name != 'workflow_dispatch'
      || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the approve action
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions/approve-bot-gated-runs
          sparse-checkout-cone-mode: false

      - name: Update behind pull request branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Where the steps hand state to each other. Overridable so a test can
          # point the step at a temporary directory and run this text
          # unmodified; on a runner the default applies. Each step reads it
          # independently so each stays runnable alone.
          state_dir="${PR_CATCHUP_DIR:-/tmp}"

          : > "$state_dir/pr-catchup-updated.txt"
          gh pr list --repo "$REPO" --state open --base main --limit 100 \
            --json number,headRefName,isCrossRepository,mergeable,reviewDecision \
            --jq '.[] | select(.isCrossRepository == false
              and .mergeable != "CONFLICTING"
              and .reviewDecision != "APPROVED")
              | "\(.number) \(.headRefName)"' \
          | while read -r num branch; do
              echo "::group::PR #$num"
              # This endpoint is the one that takes a commit subject.
              # update-branch takes `expected_head_sha` and nothing else, so
              # its merge commit is always `Merge branch 'main' into ...`,
              # which is not a Conventional Commits subject.
              #
              # It answers with the commit it created, so the new head is read
              # here rather than waited for. A branch that already carries
              # main answers 204 with an empty body, which reads as an empty
              # sha.
              err="$state_dir/pr-catchup-merge.err"
              if sha="$(gh api --method POST "repos/$REPO/merges" \
                -f base="$branch" -f head=main \
                -f commit_message="chore: merge main into #$num" \
                --jq '.sha // empty' 2>"$err")"; then
                if [ -n "$sha" ]; then
                  echo "updated #$num to $sha"
                  echo "$num $sha" >> "$state_dir/pr-catchup-updated.txt"
                else
                  echo "no update needed for #$num"
                fi
              else
                # Nothing was merged, so the branch is still behind and the
                # next push to main puts this pull request through the loop
                # again. A 409 here is a conflict the filter above could not
                # see: GitHub answers `mergeable` with UNKNOWN until it has
                # computed it, and only CONFLICTING is held out.
                echo "::warning::merging main into #$num failed, so it stays behind"
                cat "$err"
                echo "  the next push to main retries this one. If every catch-up warns"
                echo "  this way, GITHUB_TOKEN is not permitted to push to branches here."
              fi
              echo "::endgroup::"
            done

      - name: Approve the runs this catch-up caused
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          action_dir="${GITHUB_WORKSPACE}/.github/actions/approve-bot-gated-runs"
          source "$action_dir/approve-bot-gated-runs.sh"

          state_dir="${PR_CATCHUP_DIR:-/tmp}"

          : > "$state_dir/pr-catchup-gated.txt"
          : > "$state_dir/pr-catchup-silent.txt"
          : > "$state_dir/pr-catchup-blind.txt"
          if [ ! -s "$state_dir/pr-catchup-updated.txt" ]; then
            echo "no branch was updated, so there is nothing to approve"
            exit 0
          fi

          while read -r num sha; do
            # Sweep the pull request's head as it stands now, not the one the
            # update loop recorded. That loop breaks on the first head change,
            # which is not always the merge commit: a contributor push landing
            # inside the window is recorded instead, and its run is
            # human-attributed and never gated, so sweeping it finds nothing
            # held while the merge commit that lands after it stays gated.
            if live="$(gh pr view "$num" --repo "$REPO" \
              --json headRefOid --jq .headRefOid)"; then
              sha="$live"
            else
              echo "::warning::could not re-read the head of #$num;" \
                "sweeping $sha as recorded"
            fi
            echo "::group::PR #$num at $sha"

            APPROVE_BOT_GATED_OUT="$state_dir/pr-catchup-gated-$num.txt"
            rc=0
            approve_bot_gated_runs_for_sha "$sha" "$num" || rc=$?
            if [ "$rc" = "2" ]; then
              echo "$num $sha" >> "$state_dir/pr-catchup-silent.txt"
            elif [ "$rc" != "0" ]; then
              if [ -s "$APPROVE_BOT_GATED_OUT" ]; then
                while read -r id; do
                  echo "$id $num" >> "$state_dir/pr-catchup-gated.txt"
                done < "$APPROVE_BOT_GATED_OUT"
              else
                # Runs stayed gated and the helper named none, which is what a
                # failed Actions lookup looks like from here: gh writes nothing
                # to stdout, so the count reads empty and the id listing reads
                # empty too. Reading only the file would record nothing and
                # leave the verification step calling this catch-up clear.
                echo "$num $sha" >> "$state_dir/pr-catchup-blind.txt"
              fi
            fi

            echo "::endgroup::"
          done < "$state_dir/pr-catchup-updated.txt"

      - name: Fail if any caused run is still awaiting approval
        env:
          REPO: ${{ github.repository }}
        run: |
          stalled=0
          state_dir="${PR_CATCHUP_DIR:-/tmp}"

          if [ -s "$state_dir/pr-catchup-gated.txt" ]; then
            stalled=1
            while read -r id num; do
              echo "::error::run $id for PR #$num is still awaiting approval, so its required" \
                "checks cannot report"
              echo "  approve it now from the PR's checks tab, or run:"
              echo "    gh api --method POST repos/$REPO/actions/runs/$id/approve"
            done < "$state_dir/pr-catchup-gated.txt"
            echo "Approving unblocks the PR that is stuck right now. If every catch-up fails this"
            echo "way, GITHUB_TOKEN is not permitted to approve runs here."
          fi

          if [ -s "$state_dir/pr-catchup-silent.txt" ]; then
            stalled=1
            while read -r num sha; do
              echo "::error::no pull_request run ever appeared for PR #$num at $sha, so its" \
                "required checks cannot report"
              echo "  see what does exist at that commit:"
              echo "    gh api repos/$REPO/actions/runs?head_sha=$sha"
              echo "  approve anything listed as action_required, or push to the PR branch to"
              echo "  create fresh runs. This is queueing latency or suppression, not the"
              echo "  approval gate, so there may be no run to approve at all."
            done < "$state_dir/pr-catchup-silent.txt"
          fi

          if [ -s "$state_dir/pr-catchup-blind.txt" ]; then
            stalled=1
            while read -r num sha; do
              echo "::error::whether PR #$num cleared the approval gate at $sha is unknown:" \
                "an Actions lookup failed during the approval pass"
              echo "  the lookup printed nothing, which reads as an empty count and an empty"
              echo "  run list, so this is unverified rather than clear. Check the head and"
              echo "  approve anything held there:"
              echo "    gh api repos/$REPO/actions/runs?head_sha=$sha"
            done < "$state_dir/pr-catchup-blind.txt"
          fi

          if [ "$stalled" = "0" ]; then
            echo "every run this catch-up caused is past the approval gate"
            exit 0
          fi
          exit 1
