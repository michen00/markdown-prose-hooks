---
name: Release

# Only a version tag. Nothing here runs on a branch push, so the workflow cannot
# publish anything by accident, and a tag is the one event that is deliberate.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A tag is a claim that this commit is publishable, and nothing else checks
  # that claim: CI runs on the branch, and a tag can point anywhere. Registry
  # publication is irreversible -- a version cannot be re-uploaded and a name
  # cannot be reused -- so both registry jobs wait on this and on every binary.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.86.0
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: cargo build --release --locked
      - run: cargo test --locked
      - run: uv run python -m pytest -q
        env:
          REQUIRE_RUST_BINARY: '1'
      - name: Fuzz both implementations differentially
        shell: bash
        run: |
          python="$(uv run python -c 'import sys; print(sys.executable)')"
          cargo run --release --quiet --example fuzz -- \
            --start 1 --count 400 --python "$python -m markdown_prose_hooks"

  # One binary per target, each built on a runner of its own architecture rather
  # than cross-compiled through `cross`. That trades a matrix entry for a
  # container image and a linker to configure, and it means every artifact was
  # produced by a toolchain that could also run its own tests.
  #
  # The two exceptions are the Apple targets, which cross-compile between
  # themselves on any macOS runner because the SDK carries both slices.
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
            # The only entry whose host cannot run what it builds. `macos-latest`
            # is Apple Silicon and the runner image carries no Rosetta, so an
            # x86_64 test binary built here has nothing to execute it.
            emulated: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      # Pinned to the MSRV for the same reason CI is: a language feature newer
      # than `rust-version` in Cargo.toml has to fail here rather than in a
      # consumer's `cargo install`.
      - uses: dtolnay/rust-toolchain@1.86.0
        with:
          targets: ${{ matrix.target }}
      # musl links statically and needs its own gcc wrapper, which the runner
      # image does not carry. Nothing else in the matrix needs anything.
      - name: Install the musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      # A tag is not a promise that the corpus passes at that commit, so every
      # binary is judged before it is uploaded -- except the one whose host
      # architecture cannot execute it, where the run would fail for a reason
      # that says nothing about the code. That one is covered by the arm64 build
      # of the same source on the same runner.
      - name: Run the corpus against the built binary
        if: ${{ !matrix.emulated }}
        run: cargo test --release --locked --target ${{ matrix.target }}
      - name: Stage the artifact and its checksum
        shell: bash
        run: |
          set -euo pipefail
          suffix=''
          if [ '${{ runner.os }}' = 'Windows' ]; then suffix='.exe'; fi
          name="unwrap-markdown-prose-rs-${{ matrix.target }}${suffix}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/unwrap-markdown-prose-rs${suffix}" "dist/${name}"
          # Verified by whoever downloads it, so a checksum produced anywhere but
          # beside the binary it describes is worth nothing.
          if command -v sha256sum >/dev/null; then
            (cd dist && sha256sum "${name}" > "${name}.sha256")
          else
            (cd dist && shasum -a 256 "${name}" > "${name}.sha256")
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  binaries:
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      # The one job that writes to the repository, and it writes only the
      # release it was tagged for. Every other job stays read-only.
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Collect the checksums into one manifest
        shell: bash
        run: |
          set -euo pipefail
          cat dist/*.sha256 > dist/SHA256SUMS
          rm dist/*.sha256
          cat dist/SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true

  # Trusted Publishing on both registries: a short-lived OIDC token minted for
  # this workflow on this repository, rather than a long-lived secret that has
  # to be stored, rotated, and trusted to every job that can read it. Both are
  # configured, and no registry token is held as a repository secret.
  #
  # The two registries differed in what they needed first, and the difference
  # was visible only on the first release:
  #
  #   PyPI      has pending publishers, so the name was claimed in advance and
  #             `v0.0.1` published against it with no further setup.
  #             https://pypi.org/manage/account/publishing/ — project
  #             `markdown-prose-hooks`, owner `michen00`, repository
  #             `markdown-prose-hooks`, workflow `release.yml`, environment
  #             blank.
  #   crates.io has none: a trusted publisher is configured on a crate's own
  #             settings page, so the crate had to exist first. `v0.0.1`
  #             published with a CARGO_REGISTRY_TOKEN secret, the publisher was
  #             then configured against the crate that publish had created, and
  #             the secret was deleted. Same four fields, with one trap: the
  #             workflow field takes a bare filename and rejects a path.
  #
  # What the first release actually cost was neither of those. `cargo publish`
  # authenticated and was then refused with a 400, because the account had no
  # verified email address -- an account-state check rather than an
  # authorization one, which is why it was not a 403. Verifying the address and
  # re-running the one job fixed it, and no version number was spent: a refused
  # upload does not claim one.
  #
  # If either credential breaks, its job fails and the binaries still publish,
  # which is the right way round: a missing credential must not cost the
  # release.
  pypi:
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      # Mints the OIDC token. It grants nothing in this repository.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv build
      # The registry rejects a bad distribution after upload has already
      # consumed the version number, so it is checked before, not after.
      - run: uv run --with twine twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1

  crates:
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.86.0
      # No fallback, and nothing absorbing a failure. The crate exists and
      # carries a trusted publisher, so a failure here is a real one and has to
      # stop the publish rather than hand `cargo` an empty token to be refused
      # at the registry with a worse error.
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # The action's post step revokes this token when the job ends, so the
      # credential does not outlive the publish even when a later step fails.
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # Nothing above this point installs from a registry. `verify` builds from the
  # checkout, `build` builds each binary, and both publish jobs upload without
  # ever resolving what they uploaded, so a wheel missing a module or a crate
  # that will not compile from its own package would publish green. This is the
  # first step in the flow that judges a published artifact, and it needs all
  # three to exist.
  #
  # It gates nothing -- by the time it runs, every version number is spent. Its
  # value is that it reports within minutes of the publish rather than whenever
  # somebody next installs.
  smoke:
    needs: [binaries, pypi, crates]
    permissions:
      contents: read
    uses: ./.github/workflows/smoke.yml
    with:
      tag: ${{ github.ref_name }}
