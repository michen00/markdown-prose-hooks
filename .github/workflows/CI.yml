---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `astral-sh/setup-uv` is pinned to an exact version while everything else rides a
# floating major tag, and that asymmetry is upstream's rather than a slip here: v8 stopped
# publishing major and minor tags outright, citing the tj-actions compromise, so `@v9` is
# not a ref that exists. The exact pin is what its release notes prescribe.
#
# The consequence worth knowing is for dependabot.yml: this is the one action whose patch
# and minor releases raise a pull request, because the others only move when a major does.
#
# Also from v9: `prune-cache` now defaults to false. Left at the new default -- with
# `dependencies = []` there is next to nothing to prune, so the cache this grows is small
# enough that the repository limit is not in play.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every supported interpreter on Linux, plus the floor and the ceiling on
        # macOS and Windows. Windows earns its place here rather than being taken
        # on trust: this tool decides what a line ending is, and that is the one
        # platform where getting it wrong rewrites every file it touches.
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
        include:
          - os: macos-latest
            python-version: '3.10'
          - os: macos-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.10'
          - os: windows-latest
            python-version: '3.13'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv run --python ${{ matrix.python-version }} python -m pytest -q

  hook:
    # Resolving the hook through the framework is the only check that reads
    # `.pre-commit-hooks.yaml` the way a consumer does; the console script passing
    # says nothing about whether the hook definition is valid.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check pre-commit
      # `--files` rather than `--all-files`: try-repo builds its config from
      # `.pre-commit-hooks.yaml`, so the `exclude:` in `.pre-commit-config.yaml` is not
      # in scope here and the corpus fixtures would be unwrapped. The array is quoted on
      # expansion so a path with a space stays one argument.
      - name: Run both hooks through the framework
        run: |
          set -euo pipefail
          # Assigned first, then split. `mapfile < <(...)` looks equivalent and is not:
          # a process substitution's exit status is not mapfile's, so a script that failed
          # or listed nothing would yield an empty array, `set -e` would never fire, and
          # both hooks would pass having read no files at all -- the script's fail-closed
          # contract inert exactly when it matters. A command substitution's status *is*
          # the assignment's, so this one dies.
          listing=$(./.github/scripts/list-prose.sh)
          mapfile -t prose <<<"$listing"
          pre-commit try-repo . unwrap-markdown-prose --verbose --files "${prose[@]}"
          pre-commit try-repo . unwrap-markdown-prose-check --verbose --files "${prose[@]}"

  action:
    # The composite action shares no code path with the hook beyond the CLI, so a
    # green `hook` job does not cover it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The action's own default is every tracked Markdown file, which sweeps in the
      # corpus fixtures. `paths` is the input that exists for saying otherwise, so the
      # exclusion rides the public interface rather than a change to the action.
      - name: List the prose the action should see
        id: prose
        run: |
          # `pipefail` and a bare assignment, so a failing script kills the step. Inlined
          # into the printf the status was swallowed, and the failure mode was worse here
          # than in the hook job: an empty `files=` is not an error to the action, it is
          # the documented signal to fall back to its own `git ls-files` sweep -- which is
          # the full-corpus scan this step exists to prevent.
          set -euo pipefail
          files=$(./.github/scripts/list-prose.sh | tr '\n' ' ')
          printf 'files=%s\n' "$files" >>"$GITHUB_OUTPUT"
      - name: Run the action against this repository
        uses: ./
        with:
          paths: ${{ steps.prose.outputs.files }}
          write: 'false'
          fail-on-change: 'true'

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
