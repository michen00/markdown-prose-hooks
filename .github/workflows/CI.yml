---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `astral-sh/setup-uv` is pinned to an exact version where most of the actions here ride
# a floating major tag, and that asymmetry is upstream's rather than a slip here: v8
# stopped publishing major and minor tags outright, citing the tj-actions compromise, so
# `@v9` is not a ref that exists. The exact pin is what its release notes prescribe.
#
# The consequence worth knowing is for dependabot.yml: this is the one action whose patch
# and minor releases raise a pull request. The floating majors move only on a major;
# `dtolnay/rust-toolchain` is held out there because its version is the declared MSRV, as
# the comment above `rust-lint` says; and `pypa/gh-action-pypi-publish` in release.yml
# follows upstream's `release/v1` branch.
#
# Also from v9: `prune-cache` now defaults to false. Left at the new default -- with
# `dependencies = []` there is next to nothing to prune, so the cache this grows is small
# enough that the repository limit is not in play.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # A step on this job rather than a job of its own, so it needs no new
      # required context to gate anything. actionlint shellchecks every `run:`
      # block when it can find shellcheck, and the Ubuntu runner image ships
      # one, so this is the only place the embedded shell is checked for
      # certain -- the pre-commit hook is isolated from any shellcheck and
      # passes a broken block in silence on a machine without one.
      - name: Lint the workflows, including the shell inside them
        run: |
          set -euo pipefail
          command -v shellcheck >/dev/null || {
            echo '::error::shellcheck is absent, so actionlint would skip every' \
              'run: block without saying so'
            exit 1
          }
          uv tool run --from actionlint-py actionlint

  pre-commit:
    # The suite in `.pre-commit-config.yaml`, gated rather than merely advised.
    # pre-commit.ci runs every hook and autofixes what it can, but it posts no
    # required context, so a pull request could carry a red mypy, typos,
    # codespell, markdownlint, yamllint, prettier or whitespace hook and merge
    # anyway. `lint` above reaches two of them. This job is the rest.
    #
    # Not the same question as `hook` below, which resolves the generated
    # mirrors' manifests the way a consumer does and never reads this file.
    #
    # `pre-commit` itself is unpinned here, as in `hook`. A newer runner finds
    # the same things: every tool it runs is pinned by its own `rev:`, so the
    # findings come from those pins and not from this line.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check pre-commit
      # Every hook environment is built from source otherwise: a Go toolchain
      # for actionlint, Node for prettier and markdownlint, and a virtualenv
      # apiece for the Python ones. `restore-keys` is what makes that cheap on a
      # miss, and the exact key misses whenever this file changes at all, down to
      # a comment: the prefix restores the previous run's environments, leaving
      # `pre-commit` to build only the hooks whose `rev:` actually moved. Without
      # it a one-byte edit restores nothing and rebuilds all of them.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-${{ runner.os }}-
      # The three the `ci:` block skips, for the reasons stated there: the unwrap
      # hook resolves through `uv run`, and the cargo pair would answer against
      # whatever toolchain this image carries rather than the declared floor.
      # Neither goes unchecked -- `rust-lint` runs the pair at 1.86.0, and `hook`
      # runs the unwrap through the framework.
      - run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: unwrap-markdown-prose-py,cargo-fmt,cargo-clippy

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every supported interpreter on Linux, plus the floor and the ceiling on
        # macOS and Windows. Windows earns its place here rather than being taken
        # on trust: this tool decides what a line ending is, and that is the one
        # platform where getting it wrong rewrites every file it touches.
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - os: macos-latest
            python-version: '3.10'
          - os: macos-latest
            python-version: '3.14'
          - os: windows-latest
            python-version: '3.10'
          - os: windows-latest
            python-version: '3.14'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv run --python ${{ matrix.python-version }} python -m pytest -q

  coverage:
    # One upload on Ubuntu is enough: the suite is interpreter-agnostic Python, and
    # Codecov merges flags rather than needing a matrix of identical reports.
    #
    # `use_oidc` rather than an upload token, for the reason release.yml prefers
    # Trusted Publishing: a long-lived secret in a repository that needs none is
    # a liability with no offsetting convenience. Codecov refuses an anonymous
    # upload outright -- "Token required - not valid tokenless upload" -- so this
    # is the only authentication left that stores nothing, and `id-token: write`
    # is what mints the assertion it checks. The permission is granted on this
    # job alone; the workflow default above stays read-only.
    #
    # `fail_ci_if_error` is on because the alternative had already happened: with
    # it off, every upload since the badge was added was refused for want of a
    # token while this job reported success, so the only place the failure showed
    # was the badge reading "unknown". This job is not a required context, so a
    # Codecov outage is visible here without blocking a merge.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      COVERAGE_REPORT: coverage.xml
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # fetch-depth of 2 enables diff coverage
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: '3.13'
      - run: uv run python -m pytest --cov --cov-report=xml -q
      - uses: codecov/codecov-action@v7
        with:
          files: ${{ env.COVERAGE_REPORT }}
          fail_ci_if_error: true
          use_oidc: true

  hook:
    # Resolving the hook through the framework is the only check that reads a
    # `.pre-commit-hooks.yaml` the way a consumer does; the console script
    # passing says nothing about whether the hook definition is valid.
    #
    # It reads the generated mirrors rather than this tree, because this tree no
    # longer carries a manifest -- the four ids live in the two mirrors now. That
    # makes this a test of the generator's output as well, which is the artifact
    # a consumer actually resolves, and it is the only test of it that runs on
    # every push. `make mirror-diff` compares that output against what the
    # mirrors hold; this compares it against what `pre-commit` will accept.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check pre-commit
      # The generator takes no dependency outside the standard library, so this
      # needs no environment of its own. `--no-lockfile` keeps it off the network
      # and off cargo: the lockfile pins the published crate, and the `-rs` step
      # below re-resolves it anyway.
      - name: Generate the mirrors the ids live in
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_mirrors.py "${RUNNER_TEMP}/mirrors" --no-lockfile
          # `try-repo` clones the path it is given, so each tree has to be a
          # repository with a commit in it. `--all` is safe here in a way it
          # never is in a working tree: the directory was created by the line
          # above and holds nothing else.
          for kind in py rs; do
            git -C "${RUNNER_TEMP}/mirrors/${kind}" init --quiet --initial-branch=main
            git -C "${RUNNER_TEMP}/mirrors/${kind}" add --all
            git -C "${RUNNER_TEMP}/mirrors/${kind}" \
              -c user.name='CI' -c user.email='ci@example.invalid' \
              commit --quiet --message 'generated'
          done
      # `--all-files`, with no list to build and nothing to keep in step, and run
      # from this repository so the files under test are this repository's. The
      # tool reads `.unwrapignore` itself, so the exclusion reaches this caller
      # exactly as it reaches `pre-commit run` and the action -- which is what
      # `exclude:` could never do here, since try-repo builds its config from the
      # hook manifest and never reads `.pre-commit-config.yaml`.
      - run: |
          pre-commit try-repo "${RUNNER_TEMP}/mirrors/py" \
            unwrap-markdown-prose-py --all-files --verbose
      - run: |
          pre-commit try-repo "${RUNNER_TEMP}/mirrors/py" \
            unwrap-markdown-prose-py-check --all-files --verbose

      # The Rust pair resolves through the same framework, and `language: rust`
      # builds it from source -- which is the install cost the README tells a
      # consumer about, exercised here rather than asserted. What it builds is
      # the wrapper, which pins `markdown-prose-hooks` at exactly the version in
      # the manifests, so this pair can only run once that version is on
      # crates.io.
      #
      # Between a version bump and the tag that publishes it, that is a
      # legitimate state and must not turn the bump commit red -- the same window
      # `action.yml` falls back through. So it is reported and skipped rather
      # than failed. A network failure reaching the index lands here too, which
      # is the deliberate trade: the `-py` pair still ran, and `smoke.yml`
      # exercises the published `-rs` path after every release.
      - uses: dtolnay/rust-toolchain@1.86.0
      - name: Check whether the wrapper's pinned version is published
        id: crate
        shell: bash
        run: |
          set -uo pipefail
          version="$(sed -n "s/^version = ['\"]\([^'\"]*\)['\"].*/\1/p" Cargo.toml \
            | head -1)"
          if curl --fail --silent --location \
            'https://index.crates.io/ma/rk/markdown-prose-hooks' \
            | grep -q "\"vers\":\"${version}\""; then
            echo "published=true" >>"${GITHUB_OUTPUT}"
          else
            echo "::notice::markdown-prose-hooks ${version} is not on crates.io," \
              'so the -rs pair cannot resolve yet and is skipped'
            echo "published=false" >>"${GITHUB_OUTPUT}"
          fi
      - if: steps.crate.outputs.published == 'true'
        run: |
          pre-commit try-repo "${RUNNER_TEMP}/mirrors/rs" \
            unwrap-markdown-prose-rs --all-files --verbose
      - if: steps.crate.outputs.published == 'true'
        run: |
          pre-commit try-repo "${RUNNER_TEMP}/mirrors/rs" \
            unwrap-markdown-prose-rs-check --all-files --verbose

  action:
    # The composite action shares no code path with the hook beyond the CLI, so a
    # green `hook` job does not cover it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No `paths`: the action's default sweep is every tracked Markdown file, and
      # the tool now drops the corpus from that list on its own. Letting the default
      # run is the stronger test anyway -- it exercises the path a consumer takes.
      - name: Run the action against this repository
        id: default
        uses: ./
        with:
          write: 'false'
          fail-on-change: 'true'
      # Which build `auto` chose is a fact about the release rather than about
      # this commit, so it is reported and not asserted. It resolves to `rust`
      # whenever the version in Cargo.toml has a release carrying a binary for
      # this runner, and falls back in the window between a version bump and the
      # tag that publishes it -- a legitimate state, and one that must not turn
      # the version-bump commit red.
      - name: Report which implementation auto selected
        run: echo "auto selected ${{ steps.default.outputs.implementation }}"
      # The fallback explicitly, because `auto` reaches it only when the release
      # happens not to cover the runner, and a path CI never takes is a path
      # that rots.
      - name: Run the action on the Python fallback
        uses: ./
        with:
          write: 'false'
          fail-on-change: 'true'
          implementation: 'python'

  mirror-identity:
    # The two mirrors are the only thing a consumer of the four hook ids clones,
    # and the ruleset that freezes their version tags cannot outlive the
    # repository it is set on: deleting one frees every tag name it held, and a
    # new repository under the same name could serve a pinned `rev:` a different
    # tree. The numeric repository id is the one value that moves in that case
    # and in no other, so comparing it is the whole check.
    #
    # Here rather than on a schedule, for the reason smoke.yml gives about its
    # own cron: GitHub disables a schedule after 60 days without repository
    # activity, and a canary that stops reporting without saying so is worse
    # than none. Not a required context either -- it watches something outside
    # this tree, so a pull request that cannot change the answer should not be
    # blocked on reaching the network to ask.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare each mirror against the id its tags were published from
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_mirror_identity.py

  # Pinned to the MSRV on this job and on `rust-test` and `parity` below, so a
  # language feature newer than `rust-version` in Cargo.toml fails here rather
  # than in a consumer's `cargo install`. That pin and `rust-version` move
  # together, which is why dependabot.yml holds this action out of its actions
  # group. `rust-test-stable` asks the other half of the question -- whether
  # the crate still builds on a current toolchain -- and is the one place the
  # ref is allowed to float.
  #
  # No build cache on either job. `[dependencies]` is empty and stays that way,
  # so a cold compile is a couple of seconds -- less than restoring a cache
  # would cost, and one fewer action running with this repository's token.
  rust-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.86.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  rust-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The same three platforms the Python matrix uses, for the same reason:
        # this tool decides what a line ending is, and Windows is where getting
        # that wrong rewrites every file it touches. The corpus is checked out
        # verbatim there -- `.gitattributes` marks it `-text` -- so a case
        # pinning CRLF pins it on every runner.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.86.0
      - run: cargo test

  # Deliberately not a required context, for the reason `coverage` is not: the
  # ref floats, so an upstream Rust release can turn this red with no commit
  # here at fault, and gating on it would block every open pull request --
  # including a bot's, which `bot-automerge.yml` waits on the full set for.
  #
  # A separate job rather than a `toolchain` axis on `rust-test`. A matrix value
  # becomes part of the check name, so an axis would rename
  # `rust-test (ubuntu-latest)` and its two siblings, all three of which are
  # required contexts. A `pull_request` run reads the workflow from the merge
  # ref, so no ruleset state satisfies both the old and the new names at once
  # and something is blocked either way. Adding a job renames nothing.
  #
  # No matrix at all, not even a single-value one: `matrix: {os: [ubuntu-latest]}`
  # would produce `rust-test-stable (ubuntu-latest)` and rename itself the day a
  # second platform is added.
  #
  # `cargo test` and no clippy. Clippy is where a new release lands new lints,
  # and that churn is exactly what must not reach a gate; `rust-lint` keeps
  # clippy on the pinned toolchain. One platform, because a compiler regression
  # in code that touches nothing platform-specific is not platform-specific --
  # and the line-ending behavior that is lives on the pinned legs above.
  rust-test-stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: rustc --version
      - run: cargo test

  parity:
    # The CLI tier over both implementations. It is its own job rather than a
    # step on `test` because it needs a Rust toolchain, and rather than a step on
    # `rust-test` because it needs an interpreter: the harness that drives both
    # binaries is the Python one.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.86.0
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: cargo build --release
      # `_runners()` skips the Rust binary when it is absent, so that a
      # Python-only checkout still runs the tier. Here that skip would turn a
      # failed build into a silent half-run reported as a pass, so the harness is
      # told to fail instead.
      - run: uv run python -m pytest tests/test_cli_corpus.py -q
        env:
          REQUIRE_RUST_BINARY: '1'
      # The enumerated tier says the two implementations agree about what was
      # anticipated; only this says anything about what was not. The fixed range
      # is a regression net *only while the generator is frozen* -- any edit to
      # its fragment bank renames every seed -- so a fresh range derived from the
      # run number rides along and keeps exploring. A divergence worth keeping
      # becomes a corpus case, never a seed number.
      - name: Fuzz both implementations differentially
        shell: bash
        run: |
          python="$(uv run python -c 'import sys; print(sys.executable)')"
          cargo run --release --quiet --example fuzz -- \
            --start 1 --count 400 --python "$python -m markdown_prose_hooks"
          cargo run --release --quiet --example fuzz -- \
            --start $(( ${{ github.run_number }} * 400 + 100000 )) --count 200 \
            --python "$python -m markdown_prose_hooks"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
