---
name: Mirrors

# Generates `markdown-prose-hooks-py` and `markdown-prose-hooks-rs` from this
# tree and pushes each to its own repository. A consumer of two hook ids then
# clones one implementation instead of two plus the corpus that specifies them.
#
# `scripts/generate_mirrors.py` holds the reasoning about what a mirror carries.
# What lives here is only how it reaches GitHub, and two decisions about that.
#
# It appends a commit rather than force-pushing a fresh history, which is a
# deliberate departure from the "generated and force-pushed" wording in the
# design. A consumer pins `rev:`, and replacing the history strands every pin
# that is not a tag, since the commit it named stops being reachable. The tree is
# still replaced wholesale -- every file comes from the generator and anything it
# no longer emits is deleted -- so nothing is hand-editable either way. `--force`
# stays available for the case that needs it, repointing a mirror away from a
# yanked version, and that case is a `workflow_dispatch` rather than a tag.
#
# It needs the crate published first. The `-rs` mirror is a wrapper pinning
# `markdown-prose-hooks` at exactly this version, so `cargo generate-lockfile`
# cannot resolve until that version is on crates.io. That is why this waits on
# the publish jobs and why the lockfile step carries a bounded retry.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to generate from, for example v0.0.1.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to generate from. Defaults to the latest release.
        required: false
        type: string
      force:
        description: Replace each mirror's history instead of appending to it.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the tag to generate from
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${TAG:-}"
          if [ -z "${tag}" ]; then
            tag="$(gh release view --repo "${REPO}" --json tagName --jq .tagName)"
          fi
          version="${tag#v}"
          case "${version}" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::${tag} is not a version tag"
              exit 1
              ;;
          esac
          echo "tag=${tag}" >>"${GITHUB_OUTPUT}"
          echo "version=${version}" >>"${GITHUB_OUTPUT}"

      # The tag, because a mirror is a view of a released tree and its own tag
      # has to name the same commit's contents.
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.tag }}
      - uses: astral-sh/setup-uv@v9.0.0
      - uses: dtolnay/rust-toolchain@1.86.0

      - name: Generate both mirrors
        shell: bash
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          # Retried as a whole, because the one network call inside it is
          # `cargo generate-lockfile` resolving this version from crates.io, and
          # the index can lag a publish by seconds. Bounded, so a version that
          # will never appear fails in two minutes rather than never.
          attempt=1
          until uv run python scripts/generate_mirrors.py mirrors-out; do
            if [ "${attempt}" -ge 6 ]; then
              echo "::error::the generator failed; crates.io may not carry ${VERSION} yet"
              exit 1
            fi
            sleep 20
            attempt=$((attempt + 1))
          done
          find mirrors-out -type f | sort

      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.MIRROR_APP_ID }}
          private-key: ${{ secrets.MIRROR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # Scoped to the two it writes. An installation token is already
          # short-lived; naming the repositories keeps it narrow as well.
          repositories: markdown-prose-hooks-py,markdown-prose-hooks-rs

      - name: Push each mirror
        shell: bash
        env:
          TOKEN: ${{ steps.app.outputs.token }}
          ACTOR: ${{ steps.app.outputs.app-slug }}
          OWNER: ${{ github.repository_owner }}
          SOURCE: ${{ github.repository }}
          TAG: ${{ steps.target.outputs.tag }}
          VERSION: ${{ steps.target.outputs.version }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          workspace="${PWD}"
          source_sha="$(git rev-parse HEAD)"

          for kind in py rs; do
            repository="markdown-prose-hooks-${kind}"
            remote="https://x-access-token:${TOKEN}@github.com/${OWNER}/${repository}.git"
            clone="${workspace}/push-${kind}"

            git clone --quiet "${remote}" "${clone}"
            cd "${clone}"
            git config user.name "${ACTOR}[bot]"
            git config user.email "${ACTOR}[bot]@users.noreply.github.com"

            # Everything tracked goes, then the generated tree lands. Deleting
            # first is what makes this a replacement rather than a merge of the
            # two: a file the generator stopped emitting has to disappear.
            git rm -r --quiet --ignore-unmatch .
            cp -R "${workspace}/mirrors-out/${kind}/." .
            git add -A

            if git diff --cached --quiet; then
              echo "::notice::${repository} is already what the generator produces"
            else
              git commit --quiet \
                --message "chore: generate from ${SOURCE}@${TAG}" \
                --message "Source commit ${source_sha}." \
                --message "Generated by scripts/generate_mirrors.py; edits belong upstream."
              if [ "${FORCE}" = 'true' ]; then
                git push --force --quiet origin main
              else
                git push --quiet origin main
              fi
              echo "::notice::${repository} pushed $(git rev-parse --short HEAD)"
            fi

            # The tag is what a consumer pins, so it moves to whatever main now
            # is. Its deletion is blocked by a ruleset on the mirror; updating it
            # deliberately is not.
            git tag --force "${TAG}"
            git push --force --quiet origin "refs/tags/${TAG}"
            cd "${workspace}"
          done
