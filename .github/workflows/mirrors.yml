---
name: Mirrors

# Generates `markdown-prose-hooks-py` and `markdown-prose-hooks-rs` from this
# tree and pushes each to its own repository. A consumer of two hook ids then
# clones one implementation instead of two plus the corpus that specifies them.
#
# `scripts/generate_mirrors.py` holds the reasoning about what a mirror carries.
# What lives here is only how it reaches GitHub, and two decisions about that.
#
# It appends a commit rather than force-pushing a fresh history, which is a
# deliberate departure from the "generated and force-pushed" wording in the
# design. A consumer pins `rev:`, and replacing the history strands every pin
# that is not a tag, since the commit it named stops being reachable. The tree is
# still replaced wholesale -- every file comes from the generator and anything it
# no longer emits is deleted -- so nothing is hand-editable either way. There is
# no force path left at all: the input that offered one existed to repoint a
# mirror away from a yanked version, which a frozen tag turns into a version bump
# instead, and a rewritten history cannot be signed by the mechanism below.
#
# It commits through the API rather than with git, because GitHub signs what it
# creates and a runner has no key to sign with. `scripts/push_mirror.py` holds
# that reasoning. A ruleset on each mirror also freezes `v*.*.*` against every
# actor, so a version tag here is written once and never again, which is why a
# dispatch may move a mirror's main past its newest tag while a release may not:
# a readme fix should not cost a version, and it reaches only the page somebody
# reads, never what a pinned `rev:` resolves to.
#
# It needs the crate published first. The `-rs` mirror is a wrapper pinning
# `markdown-prose-hooks` at exactly this version, so `cargo generate-lockfile`
# cannot resolve until that version is on crates.io. That is why this waits on
# the publish jobs and why the lockfile step carries a bounded retry.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # This ref, and there is no input to say otherwise, because the generator
      # and its templates live in this tree: checking out an older tag would run
      # whatever generator that tag carried, and a tag from before this workflow
      # existed carries none at all. The version comes from the manifests for the
      # same reason `action.yml` reads it there -- a ref can be a branch or a
      # commit, while a release is named after a version.
      - uses: actions/checkout@v7

      - name: Resolve the version being mirrored
        id: target
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(sed -n "s/^version = ['\"]\([^'\"]*\)['\"].*/\1/p" Cargo.toml \
            | head -1)"
          case "${version}" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::Cargo.toml names no version"
              exit 1
              ;;
          esac
          # A tag that disagrees with the manifests would mirror one version
          # under another's name, which is the one mistake here nobody would see.
          if [ "${REF_TYPE}" = 'tag' ] && [ "${REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${REF_NAME} does not match the manifests' v${version}"
            exit 1
          fi
          echo "tag=v${version}" >>"${GITHUB_OUTPUT}"
          echo "version=${version}" >>"${GITHUB_OUTPUT}"
      - uses: astral-sh/setup-uv@v9.0.0
      - uses: dtolnay/rust-toolchain@1.86.0

      - name: Generate both mirrors
        shell: bash
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          # `--no-project` on both script invocations in this job. Neither takes
          # a dependency outside the standard library, and without the flag `uv
          # run` syncs the project's default dependency group anyway -- putting
          # pytest, pre-commit and the notebook's tooling into a job that mints
          # an installation token with write access to both mirrors.
          #
          # Retried as a whole, because the one network call inside it is
          # `cargo generate-lockfile` resolving this version from crates.io, and
          # the index can lag a publish by seconds. Bounded, so a version that
          # will never appear fails in two minutes rather than never.
          attempt=1
          until uv run --no-project python scripts/generate_mirrors.py mirrors-out; do
            if [ "${attempt}" -ge 6 ]; then
              echo "::error::the generator failed; crates.io may not carry ${VERSION} yet"
              exit 1
            fi
            sleep 20
            attempt=$((attempt + 1))
          done
          find mirrors-out -type f | sort

      - uses: actions/create-github-app-token@v3
        id: app
        with:
          app-id: ${{ vars.MIRROR_APP_ID }}
          private-key: ${{ secrets.MIRROR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # Scoped to the two it writes. An installation token is already
          # short-lived; naming the repositories keeps it narrow as well.
          repositories: markdown-prose-hooks-py,markdown-prose-hooks-rs

      - name: Push each mirror
        shell: bash
        env:
          # Read by the script, which authenticates every call with it.
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          SOURCE: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          body="$(printf 'Source commit %s.\n\nGenerated by %s; edits belong upstream.' \
            "${source_sha}" 'scripts/generate_mirrors.py')"

          # A person dispatching this may move a mirror's main past a version
          # tag that can no longer follow it. A release may not, because a
          # release reaching an already-mirrored version means the generator
          # changed under a published number.
          allow=()
          if [ "${EVENT}" = 'workflow_dispatch' ]; then
            allow=(--allow-past-tag)
          fi

          for kind in py rs; do
            uv run --no-project python scripts/push_mirror.py \
              --repository "${OWNER}/markdown-prose-hooks-${kind}" \
              --tree "mirrors-out/${kind}" \
              --tag "${TAG}" \
              --headline "chore: generate from ${SOURCE}@${TAG}" \
              --body "${body}" \
              "${allow[@]}"
          done
