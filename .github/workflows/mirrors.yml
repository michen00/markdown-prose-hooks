---
name: Mirrors

# Generates `markdown-prose-hooks-py` and `markdown-prose-hooks-rs` from this
# tree and pushes each to its own repository. A consumer of two hook ids then
# clones one implementation instead of two plus the corpus that specifies them.
#
# `scripts/generate_mirrors.py` holds the reasoning about what a mirror carries.
# What lives here is only how it reaches GitHub, and two decisions about that.
#
# It appends a commit rather than force-pushing a fresh history, which is a
# deliberate departure from the "generated and force-pushed" wording in the
# design. A consumer pins `rev:`, and replacing the history strands every pin
# that is not a tag, since the commit it named stops being reachable. The tree is
# still replaced wholesale -- every file comes from the generator and anything it
# no longer emits is deleted -- so nothing is hand-editable either way. `--force`
# stays available for the case that needs it, repointing a mirror away from a
# yanked version, and that case is a `workflow_dispatch` rather than a tag. It
# reaches main alone: a ruleset on each mirror freezes `v*.*.*` against every
# actor, so a version tag here is written once and never again, and the step
# below is written around that rather than against it.
#
# It needs the crate published first. The `-rs` mirror is a wrapper pinning
# `markdown-prose-hooks` at exactly this version, so `cargo generate-lockfile`
# cannot resolve until that version is on crates.io. That is why this waits on
# the publish jobs and why the lockfile step carries a bounded retry.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      force:
        description: Replace each mirror's history instead of appending to it.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # This ref, and there is no input to say otherwise, because the generator
      # and its templates live in this tree: checking out an older tag would run
      # whatever generator that tag carried, and a tag from before this workflow
      # existed carries none at all. The version comes from the manifests for the
      # same reason `action.yml` reads it there -- a ref can be a branch or a
      # commit, while a release is named after a version.
      - uses: actions/checkout@v7

      - name: Resolve the version being mirrored
        id: target
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(sed -n "s/^version = ['\"]\([^'\"]*\)['\"].*/\1/p" Cargo.toml \
            | head -1)"
          case "${version}" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::Cargo.toml names no version"
              exit 1
              ;;
          esac
          # A tag that disagrees with the manifests would mirror one version
          # under another's name, which is the one mistake here nobody would see.
          if [ "${REF_TYPE}" = 'tag' ] && [ "${REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${REF_NAME} does not match the manifests' v${version}"
            exit 1
          fi
          echo "tag=v${version}" >>"${GITHUB_OUTPUT}"
          echo "version=${version}" >>"${GITHUB_OUTPUT}"
      - uses: astral-sh/setup-uv@v9.0.0
      - uses: dtolnay/rust-toolchain@1.86.0

      - name: Generate both mirrors
        shell: bash
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          # Retried as a whole, because the one network call inside it is
          # `cargo generate-lockfile` resolving this version from crates.io, and
          # the index can lag a publish by seconds. Bounded, so a version that
          # will never appear fails in two minutes rather than never.
          attempt=1
          until uv run python scripts/generate_mirrors.py mirrors-out; do
            if [ "${attempt}" -ge 6 ]; then
              echo "::error::the generator failed; crates.io may not carry ${VERSION} yet"
              exit 1
            fi
            sleep 20
            attempt=$((attempt + 1))
          done
          find mirrors-out -type f | sort

      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.MIRROR_APP_ID }}
          private-key: ${{ secrets.MIRROR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # Scoped to the two it writes. An installation token is already
          # short-lived; naming the repositories keeps it narrow as well.
          repositories: markdown-prose-hooks-py,markdown-prose-hooks-rs

      - name: Push each mirror
        shell: bash
        env:
          TOKEN: ${{ steps.app.outputs.token }}
          ACTOR: ${{ steps.app.outputs.app-slug }}
          OWNER: ${{ github.repository_owner }}
          SOURCE: ${{ github.repository }}
          TAG: ${{ steps.target.outputs.tag }}
          VERSION: ${{ steps.target.outputs.version }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          workspace="${PWD}"
          source_sha="$(git rev-parse HEAD)"

          for kind in py rs; do
            repository="markdown-prose-hooks-${kind}"
            remote="https://x-access-token:${TOKEN}@github.com/${OWNER}/${repository}.git"
            clone="${workspace}/push-${kind}"

            git clone --quiet "${remote}" "${clone}"
            cd "${clone}"
            git config user.name "${ACTOR}[bot]"
            git config user.email "${ACTOR}[bot]@users.noreply.github.com"

            # Whether this version is already published here. A ruleset on each
            # mirror makes `v*.*.*` immutable -- neither deletable nor movable,
            # by anybody, this token included -- so a tag that is already here
            # names one tree permanently and this run cannot change what a
            # consumer pinning it resolves to. The clone carries the remote's
            # tags, so this reads the remote rather than guessing at it.
            frozen=''
            if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
              frozen='yes'
            fi

            # Everything tracked goes, then the generated tree lands. Deleting
            # first is what makes this a replacement rather than a merge of the
            # two: a file the generator stopped emitting has to disappear.
            git rm -r --quiet --ignore-unmatch .
            cp -R "${workspace}/mirrors-out/${kind}/." .
            git add -A

            if git diff --cached --quiet; then
              echo "::notice::${repository} is already what the generator produces"
            elif [ -n "${frozen}" ] && [ "${FORCE}" != 'true' ]; then
              # Landing this tree would leave main ahead of a tag that cannot
              # follow it, so the version would name one tree while the branch
              # held another. The remedy is a number rather than a force: bump,
              # and let the next tag carry it. `force` says to accept the split
              # instead -- main moves, the tag stays, and a consumer pinning the
              # tag keeps resolving to what it always did.
              echo "::error::${repository} already carries ${TAG}; bump the version"
              exit 1
            else
              git commit --quiet \
                --message "chore: generate from ${SOURCE}@${TAG}" \
                --message "Source commit ${source_sha}." \
                --message "Generated by scripts/generate_mirrors.py; edits belong upstream."
              if [ "${FORCE}" = 'true' ]; then
                git push --force --quiet origin main
              else
                git push --quiet origin main
              fi
              echo "::notice::${repository} pushed $(git rev-parse --short HEAD)"
            fi

            # Created rather than moved, and needing no force either time,
            # because it can only ever be new here: the branch above is what
            # refuses the case where it is not. A re-run that gets this far with
            # the tag already in place -- the first attempt pushed main and then
            # failed, or `force` overrode the refusal -- has nothing left to do.
            if [ -n "${frozen}" ]; then
              echo "::notice::${repository} already carries ${TAG}"
            else
              git tag "${TAG}"
              git push --quiet origin "refs/tags/${TAG}"
            fi
            cd "${workspace}"
          done
