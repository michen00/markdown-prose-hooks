---
name: Bot auto-merge disarm

# Turns off auto-merge when a pull request is labeled `do not auto-merge`. Auto-merge that
# bot-automerge.yml armed lives server-side, so the label alone does not stop it.
#
# No branch filter and no author or fork guard: this must reach every pull request the
# arming job can, including one retargeted after arming, and disarming a pull request that
# was never armed does nothing.

on:
  pull_request:
    types: [labeled]

permissions:
  pull-requests: write

concurrency:
  # Keyed on the label as well, and never canceled, so a later label event cannot cancel a
  # disarm in flight.
  group: bot-automerge-disarm-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: false

jobs:
  disarm:
    # Already case-insensitive, as GitHub compares label names: expression `==` ignores
    # case. Actions has no `toLower()` to add.
    if: github.event.label.name == 'do not auto-merge'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      # Fails closed: anything short of a confirmed "off" leads to another disable, and each
      # attempt is checked by reading the state back. Do not add `2>/dev/null` or
      # `|| false`: a swallowed read would skip the disable.
      - name: Disarm auto-merge
        run: |
          # Only a confirmed CLOSED or MERGED state skips the loop.
          state=$(gh pr view "$PR_NUMBER" --json state --jq .state || echo "")
          if [ "$state" = "CLOSED" ] || [ "$state" = "MERGED" ]; then
            echo "::notice::PR #${PR_NUMBER} is ${state}; nothing to disarm."
            exit 0
          fi
          for attempt in 1 2 3; do
            # The probe may fail, and the disable below runs anyway; its stderr stays
            # visible.
            armed=$(gh pr view "$PR_NUMBER" --json autoMergeRequest \
              --jq '.autoMergeRequest != null') || armed=""
            if [ "$armed" = "false" ]; then
              echo "::notice::Auto-merge is off on PR #${PR_NUMBER}."
              exit 0
            fi
            gh pr merge --disable-auto "$PR_NUMBER" || true
            echo "::warning::attempt ${attempt}: auto-merge not yet confirmed off on #${PR_NUMBER}."
            sleep 5
          done
          # The last attempt's disable may have worked; read once more before failing.
          if [ "$(gh pr view "$PR_NUMBER" --json autoMergeRequest \
              --jq '.autoMergeRequest != null')" = "false" ]; then
            echo "::notice::Auto-merge is off on PR #${PR_NUMBER}."
            exit 0
          fi
          echo "::error::Could not confirm auto-merge is off on #${PR_NUMBER}. Disable it by hand:"
          echo "::error::gh pr merge --disable-auto ${PR_NUMBER} --repo ${GH_REPO}"
          exit 1
