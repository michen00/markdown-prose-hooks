---
name: Prettier parity

# docs/notebooks/prettier-parity/prettier-parity.ipynb records how far this
# tool and `prettier --prose-wrap never` agree over corpus/cases, and prettier
# moves on a schedule this tree does not set: pre-commit.ci bumps its pin in
# .pre-commit-config.yaml. This job recomputes the whole measurement and fails
# when a count differs from what
# docs/notebooks/prettier-parity/prettier-parity.json records.
#
# A check rather than a bot pull request. A pull request opened with the
# default GITHUB_TOKEN triggers no `pull_request` workflows, so its required
# contexts would never report and nobody could merge it; the App that could
# open one is scoped to the two mirror repositories. A red check also shows
# on every pull request until someone re-measures, where a bot pull request
# could be left open.
#
# The version measured is the `rev:` on rbubley/mirrors-prettier in
# .pre-commit-config.yaml, the prettier this repository formats with. The
# newest release on npm could be a prettier nothing in this tree runs.
#
# prettier is installed at that version and driven through its JS API. The
# command-line tool reads .prettierignore, which holds `*.md`, so a CLI run
# inside this repository formats nothing, exits 0, and reports agreement it
# never measured.
#
# The comparison reads the JSON rather than the notebook, whose code cells
# store execution timestamps that change on every run.
#
# On `pull_request` only. Everything that can move a count -- a corpus case,
# an answer key, the artifact, the pin -- arrives through a pull request,
# and the answer depends on nothing outside the tree, so it changes between
# a pull request's run and its merge only when another pull request lands
# first. pr-catchup.yml reruns this for the open pull requests it merges
# main into: those from this repository with no conflict and no approval.
# A pull request from a fork, or one already approved, keeps its last
# answer, so two that are each green alone can both land and disagree.
# Every run measures its pull request merged with main, so the next pull
# request to run goes red for a change it did not make.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Canceled rather than queued, as in CI.yml. The workflows here that write
  # queue instead, because a half-finished write is worse than a slow one,
  # and this job writes nothing.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prettier-parity:
    # `parity` is already a required context, CI.yml's comparison of the two
    # implementations, and two jobs under one context name make it ambiguous.
    runs-on: ubuntu-latest
    # One install and one formatter pass over the corpus. A run that reaches
    # this has hung.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read the pinned prettier and the recorded parity
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f docs/notebooks/prettier-parity/prettier-parity.json ]; then
            echo "::error::docs/notebooks/prettier-parity/prettier-parity.json"
            echo "::error::is missing, and it is what this check compares"
            echo "::error::against; re-execute"
            echo "::error::docs/notebooks/prettier-parity/prettier-parity.ipynb"
            echo "::error::and commit both files"
            exit 1
          fi
          rev="$(awk '/rbubley\/mirrors-prettier/ { seen = 1; next }
                      seen && $1 == "rev:" { print $2; exit }' \
            .pre-commit-config.yaml)"
          # A read that misses leaves this empty, and an empty version would
          # install the newest release rather than the pinned one.
          case "${rev}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::.pre-commit-config.yaml names no prettier rev"
              echo "::error::expected a v-prefixed version on the hook mirror"
              exit 1
              ;;
          esac
          echo "version=${rev#v}" >>"${GITHUB_OUTPUT}"

      # Beside the checkout rather than inside it, so nothing installed here
      # reaches a hook, a lockfile or the tracked tree. The runner's own Node
      # runs it, because the version that decides the answer is prettier's,
      # and `actions/setup-node` would be one more pin to keep current.
      - name: Install that prettier beside the checkout
        shell: bash
        env:
          VERSION: ${{ steps.pin.outputs.version }}
        run: |
          set -euo pipefail
          node --version
          npm install --prefix "${RUNNER_TEMP}/prettier" \
            --no-audit --no-fund "prettier@${VERSION}"

      # The notebook's method, restated for the check; the notebook is where
      # it is explained. A restatement that drifts from it computes counts
      # the artifact does not record, and this step fails on them.
      - name: Recompute the parity the page records
        shell: bash
        env:
          VERSION: ${{ steps.pin.outputs.version }}
        run: |
          set -euo pipefail
          cat >"${RUNNER_TEMP}/parity.mjs" <<'PARITY'
          import fs from 'node:fs';
          import path from 'node:path';

          const [cases, pin, entry, artifact] = process.argv.slice(2);
          const loaded = await import(entry);
          const prettier = loaded.default ?? loaded;
          if (prettier.version !== pin) {
            throw new Error(`resolved prettier ${prettier.version}, not ${pin}`);
          }

          // Every option pinned, so a default moving upstream cannot read as
          // the tools disagreeing. Only `proseWrap` varies.
          const OPTS = {
            parser: 'markdown',
            printWidth: 80,
            tabWidth: 2,
            useTabs: false,
            endOfLine: 'lf',
            embeddedLanguageFormatting: 'off',
            plugins: [],
          };
          const fmt = (text, wrap) =>
            prettier.format(text, { ...OPTS, proseWrap: wrap });

          const toPrettier = (s) =>
            s
              .replace(/unwrap-ignore-start/g, 'prettier-ignore-start')
              .replace(/unwrap-ignore-end/g, 'prettier-ignore-end')
              .replace(/unwrap-ignore/g, 'prettier-ignore');
          const toOurs = (s) =>
            s
              .replace(/prettier-ignore-start/g, 'unwrap-ignore-start')
              .replace(/prettier-ignore-end/g, 'unwrap-ignore-end')
              .replace(/prettier-ignore/g, 'unwrap-ignore');

          const height = (s) => s.split('\n').length;
          const filled = (s) =>
            s.split('\n').filter((line) => line.trim() !== '').length;

          const rows = [];
          let crlfCases = 0;
          let crlfOurs = 0;
          let crlfTheirs = 0;

          for (const slug of fs.readdirSync(cases).sort()) {
            const dir = path.join(cases, slug);
            if (!fs.statSync(dir).isDirectory()) continue;

            const meta = Object.fromEntries(
              fs
                .readFileSync(path.join(dir, 'case.txt'), 'utf8')
                .split('\n')
                .filter((line) => line.includes(':'))
                .map((line) => [
                  line.slice(0, line.indexOf(':')).trim(),
                  line.slice(line.indexOf(':') + 1).trim(),
                ]),
            );
            const declined = meta.expected === 'unchanged';
            const keyed = fs.existsSync(path.join(dir, 'expected.md'));
            if (declined === keyed) {
              throw new Error(`${slug}: declaration and expected.md disagree`);
            }

            const input = fs.readFileSync(path.join(dir, 'input.md'), 'utf8');
            const ours = keyed
              ? fs.readFileSync(path.join(dir, 'expected.md'), 'utf8')
              : input;
            if (/prettier-ignore/.test(input)) {
              throw new Error(`${slug}: the input spells the other marker`);
            }

            // Raw bytes, never normalized: this axis asks what survives.
            if (/\r\n/.test(input)) {
              crlfCases += 1;
              if (/\r\n/.test(ours)) crlfOurs += 1;
              if (/\r\n/.test(await fmt(input, 'never'))) crlfTheirs += 1;
            }

            // `never` is prettier's answer and reaches the input alone; both
            // answers then pass through `preserve`, which restates cosmetics
            // and joins nothing. Running `never` over our side as well
            // measures prettier against itself, the notebook's control.
            const theirs = await fmt(input, 'never');
            const oursNorm = await fmt(ours, 'preserve');
            const theirsNorm = await fmt(theirs, 'preserve');
            if (
              filled(theirsNorm) < filled(theirs) ||
              filled(oursNorm) < filled(ours)
            ) {
              throw new Error(`${slug}: preserve joined lines; axes unsound`);
            }
            const agree = oursNorm === theirsNorm;

            // One document broken differently, or two documents.
            const oursFlat = await fmt(oursNorm, 'never');
            const theirsFlat = await fmt(theirsNorm, 'never');
            const sameDocument = oursFlat === theirsFlat;
            const keptOurs = height(oursNorm) - height(oursFlat);
            const keptTheirs = height(theirsNorm) - height(theirsFlat);

            const marked = /unwrap-ignore/.test(input);
            let active = false;
            let agreeTranslated = false;
            if (marked) {
              const swapped = await fmt(toPrettier(input), 'never');
              active = toOurs(swapped) !== theirs;
              agreeTranslated =
                (await fmt(toOurs(swapped), 'preserve')) === oursNorm;
            }

            rows.push({
              slug,
              declined,
              marked,
              active,
              agree,
              agreeTranslated,
              identical: theirs === ours,
              sameDocument,
              keptOurs,
              keptTheirs,
            });
          }

          const count = (group, predicate) => group.filter(predicate).length;
          const plain = rows.filter((row) => !row.marked);
          const inert = rows.filter((row) => row.marked && !row.active);
          const live = rows.filter((row) => row.marked && row.active);
          const apart = rows.filter((row) => !row.agree);
          const declined = rows.filter((row) => row.declined);

          // The shape docs/notebooks/prettier-parity/prettier-parity.json
          // carries, key for key. A count
          // renamed, added or dropped in the notebook changes here in the
          // same commit, and the comparison below fails when it does not.
          const fresh = {
            prettier_version: pin,
            corpus_cases: rows.length,
            cases_declared_unchanged: declined.length,
            axis_1_prose_joining: {
              cases: plain.length,
              agree: count(plain, (row) => row.agree),
            },
            axis_2_ignore_directives: {
              cases: inert.length + live.length,
              marker_inert: {
                cases: inert.length,
                agree: count(inert, (row) => row.agree),
              },
              marker_active_as_written: {
                cases: live.length,
                agree: count(live, (row) => row.agree),
              },
              marker_active_translated: {
                cases: live.length,
                agree: count(live, (row) => row.agreeTranslated),
              },
            },
            axis_3_line_endings: {
              cases: crlfCases,
              tool_preserves_crlf: crlfOurs,
              prettier_preserves_crlf: crlfTheirs,
            },
            overall: {
              agree: rows.length - apart.length,
              disagree: apart.length,
              same_document_broken_differently: count(
                apart,
                (row) => row.sameDocument,
              ),
              prettier_joined_more: count(
                apart,
                (row) => row.sameDocument && row.keptTheirs < row.keptOurs,
              ),
              prettier_joined_less: count(
                apart,
                (row) => row.sameDocument && row.keptTheirs > row.keptOurs,
              ),
              structurally_different: count(apart, (row) => !row.sameDocument),
              raw_byte_identical: count(rows, (row) => row.identical),
              declined_by_tool: declined.length,
              declined_but_prettier_rewrites: count(
                declined,
                (row) => !row.agree,
              ),
            },
          };

          console.log('::group::the measurement this run made');
          console.log(JSON.stringify(fresh, null, 2));
          console.log('::endgroup::');

          // Keyed by the path as a JSON array rather than dot-joined, so a key
          // holding a dot, or an empty key, cannot pass for a nested count.
          // The dotted form is only for the messages.
          const numbers = (node, at, into) => {
            if (node !== null && typeof node === 'object') {
              for (const [key, value] of Object.entries(node)) {
                numbers(value, [...at, key], into);
              }
            } else if (typeof node === 'number') {
              into.set(JSON.stringify(at), node);
            }
            return into;
          };
          const shown = (where) => JSON.parse(where).join('.');

          const recorded = JSON.parse(fs.readFileSync(artifact, 'utf8'));
          const moved = [];
          if (typeof recorded.prettier_version !== 'string') {
            moved.push('prettier_version: the artifact names no prettier');
          } else if (recorded.prettier_version !== pin) {
            moved.push(
              `prettier_version: recorded ${recorded.prettier_version}, ` +
                `.pre-commit-config.yaml pins ${pin}`,
            );
          }
          // docs/notebooks/prettier-parity/prettier-parity.ipynb prints one
          // case per family of
          // disagreement, in full, and names them here. Existing is not enough
          // for a case to keep standing for a difference: were prettier to
          // start agreeing on one, the page would print two identical blocks
          // under a heading promising a difference, and no count would have to
          // move for that -- one case can leave the disagreements in the same
          // release another one joins them.
          //
          // Only that property is checked here, because only that property is
          // computed here. Which family a case stands for is asserted in the
          // notebook, where the classifier lives; a second copy of it in this
          // file would be a second clock, free to disagree with the first.
          const examples = recorded.disagreement_examples;
          if (
            !Array.isArray(examples) ||
            examples.length === 0 ||
            examples.some((slug) => typeof slug !== 'string')
          ) {
            moved.push('disagreement_examples: the artifact names no examples');
          } else {
            const bySlug = new Map(rows.map((row) => [row.slug, row]));
            for (const slug of examples) {
              const row = bySlug.get(slug);
              if (row === undefined) {
                moved.push(
                  `disagreement_examples: the corpus no longer carries ${slug}`,
                );
              } else if (row.agree) {
                moved.push(
                  `disagreement_examples: prettier now agrees on ${slug}`,
                );
              }
            }
          }
          const here = numbers(fresh, [], new Map());
          const there = numbers(recorded, [], new Map());
          for (const [where, was] of there) {
            if (!here.has(where)) {
              moved.push(`${shown(where)}: recorded ${was}, computed by nothing here`);
            } else if (here.get(where) !== was) {
              moved.push(`${shown(where)}: recorded ${was}, measured ${here.get(where)}`);
            }
          }
          for (const [where, now] of here) {
            if (!there.has(where)) {
              moved.push(`${shown(where)}: measured ${now}, missing from the artifact`);
            }
          }

          if (moved.length === 0) {
            console.log(`::notice::the parity page holds against prettier ${pin}`);
            process.exit(0);
          }
          for (const problem of moved) console.log(`::error::${problem}`);
          console.log(
            '::error::re-execute ' +
              'docs/notebooks/prettier-parity/prettier-parity.ipynb with the ' +
              'command in CONTRIBUTING.md#the-parity-notebook and commit ' +
              'what it wrote',
          );
          process.exit(1);
          PARITY
          node "${RUNNER_TEMP}/parity.mjs" corpus/cases "${VERSION}" \
            "${RUNNER_TEMP}/prettier/node_modules/prettier/index.mjs" \
            docs/notebooks/prettier-parity/prettier-parity.json
