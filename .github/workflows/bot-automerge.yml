---
name: Bot auto-merge

# Approves eligible Dependabot and pre-commit-ci pull requests and arms native auto-merge
# (squash) on them.
#
# No check polling: `gh pr checks --required --watch` fails when it runs before CI has
# registered its checks, and auto-merge waits for required checks anyway.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

# Dependabot-triggered runs are read-only by default, and this block raises them, so
# `pull_request_target` is not needed.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bot-automerge:
    # The guard reads `pull_request.user.login`, not `github.actor`: the actor is whoever
    # caused this event, so a later push by anyone else would skip the job.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.user.login == 'dependabot[bot]' ||
      github.event.pull_request.user.login == 'pre-commit-ci[bot]') &&
      !contains(github.event.pull_request.labels.*.name, 'do not auto-merge')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@v3

      - name: Report metadata that cannot be gated on
        if: >-
          github.event.pull_request.user.login == 'dependabot[bot]' &&
          !steps.meta.outputs.update-type
        env:
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
        run: |
          echo "::notice::No update-type for ${ECOSYSTEM:-unknown}; leaving this for a human."

      # The next step recomputes merge commits, so it needs git objects. This checks out
      # the default branch, never the pull request's head, and the next step fetches the
      # pull request's commits as objects only: nothing from the pull request runs.
      - name: Check out the default branch's history
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify every commit was created by GitHub
        id: provenance
        run: |
          # The author login alone proves nothing: it is resolved from the author email,
          # which any pusher can set. So every commit must also be created by GitHub, and
          # every commit that is not a merge must be authored by the pull request's author.
          #
          # A merge commit is trusted if it is mechanical or if a repository admin
          # authored it. Mechanical means exactly two parents, and a tree identical to a
          # clean merge of them, which `git merge-tree` recomputes here. Update branch and
          # pr-catchup.yml's merges through the merges API succeed only when the merge is
          # clean, so they pass, whoever made them. GitHub records whoever makes a merge
          # in its web interface or through the merges API as its author, so an admin's
          # merge passes even when it resolves a conflict by hand or carries other edits.
          # Anyone else's such merge is not mechanical, and neither is an octopus merge,
          # which has more than two parents, so it holds the pull request. Admin means the
          # collaborator permission API answers `admin`, asked once per author with only
          # the metadata read every token has; a failed lookup, or an author GitHub cannot
          # name, counts as not an admin.
          #
          # GitHub also signs commits that an App or `GITHUB_TOKEN` creates through its API,
          # with any author, tree and parents, so for commits that are not merges, and for
          # merges attributed to an admin, this trusts any holder of a write token. Where
          # the base branch requires approval of the most recent push, the approval below
          # does not count on a commit github-actions pushed.
          #
          # Fails closed: a failed query or fetch, or a commit count that is not an
          # integer, leaves `trusted` unset, and no step below arms.
          set -euo pipefail
          jq_rows='.[] | [
            (if (.commit.verification.verified == true)
                and (.commit.verification.reason == "valid")
                and ((.committer.login // "") == "web-flow")
                and ((.commit.verification.payload // "") | split("\n")
                     | any(startswith("committer GitHub <noreply@github.com>")))
             then "github" else "elsewhere" end),
            (if (.parents | length) >= 2 then "merge" else "plain" end),
            (.author.login // "<none>"),
            .sha,
            ([.parents[].sha] | join(" "))
          ] | join("|")'
          # The endpoint returns at most 250 commits and still exits 0, so refuse rather
          # than inspect part of the pull request.
          total=$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" --jq '.commits')
          # A count that is not an integer would make the `-gt` and `-ne` tests below error
          # inside `if`, which reads as false and falls through to trusting the pull request.
          if ! [[ "$total" =~ ^[0-9]+$ ]]; then
            echo "::error::could not read the PR's commit count; holding."
            exit 1
          fi
          if [ "$total" -gt 250 ]; then
            echo "::warning::${total} commits exceeds the 250 this API returns; holding."
            echo "trusted=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          rows=$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}/commits" --paginate --jq "$jq_rows")
          seen=$(printf '%s\n' "$rows" | grep -c . || true)
          if [ "$seen" -ne "$total" ]; then
            echo "::warning::inspected ${seen} of ${total} commits; holding."
            echo "trusted=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"
          # Succeeds only for a commit with exactly two parents whose tree is the clean
          # merge of them. merge-tree fails on a conflict, and so does a missing object.
          mechanical() {
            local sha=$1 first second extra clean
            read -r first second extra <<< "$2"
            if [ -z "$second" ] || [ -n "$extra" ]; then
              return 1
            fi
            clean=$(git merge-tree --write-tree --no-messages "$first" "$second") || return 1
            [ "$clean" = "$(git rev-parse --verify "${sha}^{tree}")" ]
          }
          # Succeeds only when the repository reports `admin` for the login, which is
          # looked up once. A failed lookup, an empty login and `<none>` are not admin.
          admins=' '
          others=' '
          admin() {
            local login=$1 permission
            if [ -z "$login" ] || [ "$login" = "<none>" ]; then
              return 1
            fi
            case $admins in *" $login "*) return 0 ;; esac
            case $others in *" $login "*) return 1 ;; esac
            permission=$(gh api "repos/${GH_REPO}/collaborators/${login}/permission" \
              --jq .permission) || permission=unknown
            if [ "$permission" = admin ]; then
              admins="${admins}${login} "
              return 0
            fi
            others="${others}${login} "
            return 1
          }
          rejected=0
          while IFS='|' read -r origin kind commit_author sha parents; do
            [ -z "$origin" ] && continue
            if [ "$origin" != "github" ]; then
              echo "::warning::a commit was not created by GitHub; holding."
              rejected=$((rejected + 1))
            elif [ "$kind" != "merge" ] && [ "$commit_author" != "$AUTHOR" ]; then
              echo "::warning::non-merge commit authored by ${commit_author}; holding."
              rejected=$((rejected + 1))
            elif [ "$kind" = "merge" ] && ! mechanical "$sha" "$parents" &&
                 ! admin "$commit_author"; then
              echo "::warning::merge ${sha} by ${commit_author} is neither a clean merge" \
                   "of two parents nor an admin's; holding."
              rejected=$((rejected + 1))
            fi
          done <<< "$rows"
          if [ "$rejected" -ne 0 ]; then
            echo "trusted=false" >>"$GITHUB_OUTPUT"
          else
            echo "trusted=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Decide eligibility
        id: eligible
        if: steps.provenance.outputs.trusted == 'true'
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
        run: |
          set -euo pipefail
          # A pre-commit-ci pull request has no semver metadata. It is eligible because CI
          # runs the hooks it bumps over this repository, which exercises the new revisions.
          if [ "$AUTHOR" = "pre-commit-ci[bot]" ]; then
            echo "::notice::pre-commit-ci hook bump; eligible."
            echo "should_merge=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor)
              echo "::notice::Dependabot ${UPDATE_TYPE}; eligible."
              echo "should_merge=true" >>"$GITHUB_OUTPUT"
              ;;
            version-update:semver-major)
              # CI exercises only code a pull request runs, so a major used only by a
              # workflow that no pull request starts, such as publishing, merges untested.
              echo "::notice::${ECOSYSTEM:-unknown} major; eligible on green CI."
              echo "should_merge=true" >>"$GITHUB_OUTPUT"
              ;;
            *)
              echo "::warning::Holding ${UPDATE_TYPE:-unknown update type} for a human."
              echo "should_merge=false" >>"$GITHUB_OUTPUT"
              ;;
          esac

      # `gh pr merge --auto` merges at once when the repository has auto-merge disabled or
      # nothing is required of the pull request, so check both first. Neither query has a
      # fallback: an unreadable answer must not arm.
      - name: Verify the gate this workflow delegates to actually exists
        if: steps.eligible.outputs.should_merge == 'true'
        run: |
          set -euo pipefail
          if [ "$(gh api "repos/${GH_REPO}" --jq '.allow_auto_merge')" != "true" ]; then
            echo "::error::Auto-merge is disabled on ${GH_REPO}, so --auto would merge now"
            echo "::error::rather than wait. Enable it in repository settings."
            exit 1
          fi
          # This endpoint returns the rules configured on the branch, not the ones the
          # caller is subject to: an account in `bypass_actors` still gets every rule.
          checks=$(gh api "repos/${GH_REPO}/rules/branches/${DEFAULT_BRANCH}" \
            --jq '[.[] | select(.type == "required_status_checks")] | length')
          if [ "$checks" -eq 0 ]; then
            echo "::error::No required status checks on ${DEFAULT_BRANCH}; --auto would"
            echo "::error::merge immediately. Add a ruleset before arming anything."
            exit 1
          fi

      # Re-read the label: one applied during this run is not in the event payload, and the
      # disarm run may already have finished.
      - name: Re-check the kill switch, then approve and arm
        if: steps.eligible.outputs.should_merge == 'true'
        run: |
          # Read into a variable under `set -e`, so a failed query is not read as "no label".
          set -euo pipefail
          labels=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name')
          # Case-insensitive, as GitHub compares label names.
          if grep -qixF 'do not auto-merge' <<< "$labels"; then
            echo "::warning::do not auto-merge applied since this run started; not arming."
            exit 0
          fi
          # Approve and arm in one step: the disarm workflow does not dismiss reviews, so an
          # approval on a pull request left unarmed would stand.
          decision=$(gh pr view "$PR_NUMBER" --json reviewDecision --jq .reviewDecision)
          if [ "$decision" = "APPROVED" ]; then
            echo "::notice::Already approved."
          else
            gh pr review --approve "$PR_NUMBER" ||
              echo "::warning::approval refused; auto-merge will wait for a reviewer."
          fi
          gh pr merge --auto --squash "$PR_NUMBER"

      # Auto-merge already armed stays armed server-side, so without this step GitHub would
      # merge a later push the guards rejected. `always()` withdraws after a failed step
      # too, and `!= 'true'` matches a skipped `eligible` step's empty output.
      - name: Withdraw a standing arm when the decision is to hold
        if: always() && steps.eligible.outputs.should_merge != 'true'
        run: |
          set -euo pipefail
          armed=$(gh pr view "$PR_NUMBER" --json autoMergeRequest \
            --jq '.autoMergeRequest != null')
          if [ "$armed" = "true" ]; then
            echo "::warning::#${PR_NUMBER} is armed but no longer eligible; disarming."
            gh pr merge --disable-auto "$PR_NUMBER"
          fi
