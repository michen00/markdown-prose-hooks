---
name: Bot auto-merge

# Approves eligible Dependabot and pre-commit-ci pull requests and arms native auto-merge
# (squash) on them. GitHub merges once every rule on the base branch is met: required
# checks, reviews and resolved threads.
#
# No check polling: `gh pr checks --required --watch` fails when it runs before CI has
# registered its checks. Auto-merge needs at least one required check; with none, GitHub
# refuses `--auto`.
#
# Both bots are armed because pre-commit.ci, where installed, raises hook bumps under
# every `autoupdate_schedule` value. dependabot.yml has no `pre-commit` entry so that the
# two do not open the same bumps.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

# Only the scopes the steps below use. Dependabot-triggered runs are read-only by default,
# and this block raises them, so `pull_request_target` is not needed.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bot-automerge:
    # Same-repository bot pull requests without the `do not auto-merge` label. The label
    # stops this job from arming; bot-automerge-disarm.yml turns off auto-merge that is
    # already armed. The guard reads `pull_request.user.login`, not `github.actor`: the
    # actor is whoever caused this event, so a later push by anyone else would skip the job.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.user.login == 'dependabot[bot]' ||
      github.event.pull_request.user.login == 'pre-commit-ci[bot]') &&
      !contains(github.event.pull_request.labels.*.name, 'do not auto-merge')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      # No checkout: nothing below reads the repository.

      # Dependabot only: this action fails on a pull request without Dependabot's metadata
      # trailer, so a pre-commit-ci one would fail the job.
      - name: Fetch Dependabot metadata
        id: meta
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@v3

      # Keep fetch-metadata at v3 or newer: v2 left update-type empty for some ecosystems,
      # and their pull requests stopped merging without notice. One that still has none is
      # held, and this says so.
      - name: Report metadata that cannot be gated on
        if: >-
          github.event.pull_request.user.login == 'dependabot[bot]' &&
          !steps.meta.outputs.update-type
        env:
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
        run: |
          echo "::notice::No update-type for ${ECOSYSTEM:-unknown}; leaving this for a human."

      - name: Verify every commit was created by GitHub
        id: provenance
        run: |
          # Every commit must be created by GitHub and, unless it is a merge, authored by
          # the bot that opened the pull request. The author login alone proves nothing: it
          # is resolved from the author email, which any pusher can set. The `web-flow`
          # committer and the signed payload's committer line are both required, so the
          # check does not rest on either alone.
          #
          # Merges are exempt from the author check so that Update branch and catch-up
          # merges pass. GitHub also signs commits that an App or `GITHUB_TOKEN` creates
          # through its API, which accepts any tree and parents, so the exemption trusts any
          # holder of a write token. Where the base branch requires approval of the most
          # recent push, the approval below cannot count on a commit github-actions pushed.
          #
          # Fails closed: nothing is swallowed, so a failed query leaves `trusted` unset and
          # no step below arms.
          set -euo pipefail
          jq_rows='.[] | [
            (if (.commit.verification.verified == true)
                and (.commit.verification.reason == "valid")
                and ((.committer.login // "") == "web-flow")
                and ((.commit.verification.payload // "") | split("\n")
                     | any(startswith("committer GitHub <noreply@github.com>")))
             then "github" else "elsewhere" end),
            (if (.parents | length) >= 2 then "merge" else "plain" end),
            (.author.login // "<none>")
          ] | join("|")'
          # The endpoint returns at most 250 commits and still exits 0, so refuse rather
          # than inspect part of the pull request.
          total=$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" --jq '.commits')
          if [ "$total" -gt 250 ]; then
            echo "::warning::${total} commits exceeds the 250 this API returns; holding."
            echo "trusted=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          rows=$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}/commits" --paginate --jq "$jq_rows")
          seen=$(printf '%s\n' "$rows" | grep -c . || true)
          if [ "$seen" -ne "$total" ]; then
            echo "::warning::inspected ${seen} of ${total} commits; holding."
            echo "trusted=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          rejected=0
          while IFS='|' read -r origin kind commit_author; do
            [ -z "$origin" ] && continue
            if [ "$origin" != "github" ]; then
              echo "::warning::a commit was not created by GitHub; holding."
              rejected=$((rejected + 1))
            elif [ "$kind" != "merge" ] && [ "$commit_author" != "$AUTHOR" ]; then
              echo "::warning::non-merge commit authored by ${commit_author}; holding."
              rejected=$((rejected + 1))
            fi
          done <<< "$rows"
          if [ "$rejected" -ne 0 ]; then
            echo "trusted=false" >>"$GITHUB_OUTPUT"
          else
            echo "trusted=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Decide eligibility
        id: eligible
        if: steps.provenance.outputs.trusted == 'true'
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
        run: |
          set -euo pipefail
          # A pre-commit-ci pull request has no semver metadata. It is eligible because CI
          # runs the hooks it bumps over this repository, which exercises the new revisions.
          if [ "$AUTHOR" = "pre-commit-ci[bot]" ]; then
            echo "::notice::pre-commit-ci hook bump; eligible."
            echo "should_merge=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor)
              echo "::notice::Dependabot ${UPDATE_TYPE}; eligible."
              echo "should_merge=true" >>"$GITHUB_OUTPUT"
              ;;
            version-update:semver-major)
              # Majors merge on green CI too. CI exercises only code a pull request runs, so
              # a major used only in a workflow no pull request starts merges unexercised
              # and is fixed forward; the cooldowns in dependabot.yml are the only delay.
              # That includes the publish workflows, which hold the publishing credentials.
              #
              # fetch-metadata reports ecosystems as branch-name slugs (`github_actions`,
              # `uv`), not dependabot.yml keys. A test against a config key never matches,
              # and every major then falls through to a hold without failing.
              echo "::notice::${ECOSYSTEM:-unknown} major; eligible on green CI."
              echo "should_merge=true" >>"$GITHUB_OUTPUT"
              ;;
            *)
              echo "::warning::Holding ${UPDATE_TYPE:-unknown update type} for a human."
              echo "should_merge=false" >>"$GITHUB_OUTPUT"
              ;;
          esac

      # `gh pr merge --auto` does not refuse when the repository has auto-merge disabled or
      # nothing is required of the pull request: it merges at once, and the run still
      # passes and logs `eligible`. So both are checked before arming, with no fallback on
      # either query, because an unreadable answer must not arm.
      - name: Verify the gate this workflow delegates to actually exists
        if: steps.eligible.outputs.should_merge == 'true'
        run: |
          set -euo pipefail
          if [ "$(gh api "repos/${GH_REPO}" --jq '.allow_auto_merge')" != "true" ]; then
            echo "::error::Auto-merge is disabled on ${GH_REPO}, so --auto would merge now"
            echo "::error::rather than wait. Enable it in repository settings."
            exit 1
          fi
          # This endpoint returns the rules configured on the branch, not the ones the
          # caller is subject to: an account in `bypass_actors` still gets every rule.
          checks=$(gh api "repos/${GH_REPO}/rules/branches/${DEFAULT_BRANCH}" \
            --jq '[.[] | select(.type == "required_status_checks")] | length')
          if [ "$checks" -eq 0 ]; then
            echo "::error::No required status checks on ${DEFAULT_BRANCH}; --auto would"
            echo "::error::merge immediately. Add a ruleset before arming anything."
            exit 1
          fi

      # Re-read the label: one applied during this run is not in the event payload, and the
      # disarm run may already have finished.
      - name: Re-check the kill switch, then approve and arm
        if: steps.eligible.outputs.should_merge == 'true'
        run: |
          # Read into a variable under `set -e`, so a failed query is not read as "no label".
          set -euo pipefail
          labels=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name')
          # Case-insensitive, as GitHub compares label names.
          if grep -qixF 'do not auto-merge' <<< "$labels"; then
            echo "::warning::do not auto-merge applied since this run started; not arming."
            exit 0
          fi
          # Approve and arm in one step: the disarm workflow does not dismiss reviews, so an
          # approval on a pull request left unarmed would stand.
          #
          # The approval is github-actions'. Where the base branch requires approval of the
          # most recent push, an approval counts only from an identity other than the last
          # pusher, so a push under the default token, such as a catch-up merge, stops it
          # counting. A refused approval leaves the pull request for a person.
          decision=$(gh pr view "$PR_NUMBER" --json reviewDecision --jq .reviewDecision)
          if [ "$decision" = "APPROVED" ]; then
            echo "::notice::Already approved."
          else
            gh pr review --approve "$PR_NUMBER" ||
              echo "::warning::approval refused; auto-merge will wait for a reviewer."
          fi
          gh pr merge --auto --squash "$PR_NUMBER"

      # A hold above only declines to arm again. Auto-merge already armed stays armed
      # server-side, so without this step GitHub would merge a later push the guards
      # rejected. `always()` so that a failed step also withdraws; `!= 'true'` also
      # matches a skipped `eligible` step, whose output is empty.
      - name: Withdraw a standing arm when the decision is to hold
        if: always() && steps.eligible.outputs.should_merge != 'true'
        run: |
          set -euo pipefail
          armed=$(gh pr view "$PR_NUMBER" --json autoMergeRequest \
            --jq '.autoMergeRequest != null')
          if [ "$armed" = "true" ]; then
            echo "::warning::#${PR_NUMBER} is armed but no longer eligible; disarming."
            gh pr merge --disable-auto "$PR_NUMBER"
          fi
