---
name: Prose body

# This repository reading its own pull request bodies through the reporting
# half of the body surface. A body renders every newline as a visible break,
# and the bodies opened here are written in an editor or a heredoc rather than
# in the browser field, which is the authorship that
# docs/design/unwrap-pr-body.md identifies as the one that wraps.
#
# The reporting half. It posts the tidied body and changes nothing, so
# applying it stays with the author. prose-body-write.yml is the editing half
# and takes the events this one does not.
#
# Called by path rather than by release tag, so a pull request that changes
# the reporting workflow is exercised by its own run. Under `pull_request`
# both files come from the merge commit, and the `pull-requests: write` below
# is therefore granted by a file the pull request carries: it reaches anyone
# with push access to this repository.
on:
  pull_request:
    # `edited` is not in the default set and fires alone when a body changes.
    # Without it, an author who replaces the body with the tidied text
    # produces no run, and the report stands on a body that is already clean.
    #
    # `opened` and `reopened` belong to prose-body-write.yml instead. Sharing
    # an event would run both halves at once and have this one describe a body
    # the edit is about to replace. A body opening wrapped is therefore
    # rewritten rather than reported. The edit skips a draft, which reaches
    # this half on its first push or body edit; `ready_for_review` is the
    # third way out of draft state and belongs to the edit, so a draft marked
    # ready is rewritten with no report before it.
    types: [synchronize, edited]

permissions: {}

jobs:
  # The called workflow pins the action to this tree's own version, and a job
  # naming a release that does not exist fails before its first step. From a
  # version bump until its tag there is no such release, and the bump's own
  # pull request falls inside that interval: the tag names the squashed
  # commit, which exists only once the pull request has merged. The report is
  # skipped there rather than left to fail.
  pin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tagged: ${{ steps.tag.outputs.tagged }}
    steps:
      - name: Look for the tag this tree's version names
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # From the commit the called workflow is read from, which under
          # `pull_request` is the merge commit rather than the base. Matched
          # the way scripts/bump_version.py reads the version it moves.
          version="$(gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/${GITHUB_REPOSITORY}/contents/pyproject.toml?ref=${GITHUB_SHA}" \
            | sed -n "s/^version = '\(.*\)'\$/\1/p")"
          if [ -z "${version}" ]; then
            echo '::error::pyproject.toml names no version'
            exit 1
          fi
          # `--exit-code` makes an absent ref exit 2, so any other failure is
          # a lookup that did not happen, and it stops the run.
          status=0
          git ls-remote --exit-code --tags \
            "https://github.com/${GITHUB_REPOSITORY}" "refs/tags/v${version}" \
            >/dev/null || status=$?
          case "${status}" in
            0) echo 'tagged=true' >>"${GITHUB_OUTPUT}" ;;
            2)
              echo "::notice::v${version} is not tagged yet, so the release" \
                'the called workflow pins does not exist'
              echo 'tagged=false' >>"${GITHUB_OUTPUT}"
              ;;
            *) exit "${status}" ;;
          esac

  report:
    needs: pin
    if: needs.pin.outputs.tagged == 'true'
    # Only the comment needs a scope, and the called workflow declares none of
    # its own so that this grant reaches it.
    permissions:
      pull-requests: write
    uses: ./.github/workflows/unwrap-pr-body-check.yml
