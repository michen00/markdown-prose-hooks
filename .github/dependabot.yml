---
# There is deliberately no `pre-commit` entry: pre-commit.ci is installed on this
# repository and its `autoupdate_schedule` accepts only weekly, monthly or quarterly --
# no value stands it down -- so it raises hook bumps whatever this file says. Adding the
# ecosystem would duplicate those pull requests rather than replace them, and two bots
# opening the same bump is worse than either owning it. .pre-commit-config.yaml sets
# that cadence; bot-automerge.yml arms both authors.
version: 2
updates:
  # Nothing here is a runtime dependency: `dependencies = []`, and the lock file covers
  # the dev group alone -- pre-commit, pytest, pytest-cov, and what the benchmark notebook
  # needs. A bump cannot reach a repository that installs this hook, only the test run
  # that would catch it, so patch and minor ride on green CI and a major waits for a
  # person.
  #
  # ruff is deliberately not in that group. It is pinned once, as the `rev:` on the
  # ruff-pre-commit repo in .pre-commit-config.yaml, which pre-commit.ci owns; a pin
  # here would compete with that one on a different schedule, and the comment above
  # that `rev:` says why the two cannot be held level.
  #
  # No cooldown, where the actions ecosystem below sets one, and the asymmetry is about
  # blast radius rather than an oversight. A soak does not make a compromised release
  # harmless; it makes adopting it late, and it earns that lag only where the damage
  # would be large. Actions execute with this repository's own token inside jobs holding
  # write permissions, which is what the number down there is for. These are dev tools:
  # they reach no repository that installs the hook, and what they break they break in
  # front of a red check rather than quietly. Delay costs something real against that --
  # a newer pytest reports a failure better than an older one.
  #
  # Not on majors either, and that key is the one worth saying out loud, because holding
  # it looks prudent. A Dependabot cooldown delays raising the pull request rather than
  # merging it, so on the class a person reviews anyway it postpones the decision instead
  # of guarding it. Being told late about a major is the opposite of the help intended.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    groups:
      uv-major:
        update-types: [major]
      uv-minor-patch:
        update-types: [minor, patch]

  # Actions here ride a floating major tag wherever upstream publishes one, so Dependabot
  # raises a pull request only when a major moves. Holding majors -- the obvious policy,
  # and the one the sibling repositories started with -- would therefore hold nearly every
  # actions pull request this repository ever receives. That is an outage, not a policy.
  # The cooldown below is what replaces the hold, and the two are a matched pair:
  # bot-automerge.yml arms actions majors, and this delay is the only soak period between
  # a release being published and it merging here unattended.
  #
  # Not every pin floats, and `grep -rn 'uses:' .github/workflows` lists the ones that
  # do not. `astral-sh/setup-uv` is pinned exactly because upstream stopped publishing
  # major tags at v8, so its patch and minor releases show up here; CI.yml carries that
  # reasoning at the pin itself. `michen00/markdown-prose-hooks` is pinned to a release
  # for the reason unwrap-propose.yml gives at the line, and reaches this ecosystem the
  # same way. `dtolnay/rust-toolchain` carries the declared MSRV rather than a version
  # to bump wherever it is pinned, which is what the `ignore:` entry below is for. That
  # entry names the action rather than a version, so it also covers the deliberately
  # floating `@stable` ref in `rust-test-stable`, which has nothing to bump either.
  # `pypa/gh-action-pypi-publish` is used through the `release/v1` branch upstream
  # documents, so it has no major tag to follow.
  #
  # Still no cargo ecosystem, for the reason there is no runtime Python one: the
  # Rust crate declares no dependencies either, so the entry would poll a lock
  # file that only ever records the crate itself.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: '0 0 1,15 * *' # 1st and 15th monthly at midnight UTC
    groups:
      actions:
        patterns: ['*']
    ignore:
      # `dtolnay/rust-toolchain@1.86.0` is not a dependency held at a version --
      # the version *is* the declared MSRV, matching `rust-version` in
      # Cargo.toml. Dependabot reads the tag as semver and would raise it to the
      # newest release, and bot-automerge.yml arms actions updates, so the floor
      # this repository promises could rise unattended and untested. Raising it
      # is a decision with a changelog entry, taken in both files at once.
      - dependency-name: dtolnay/rust-toolchain
    cooldown:
      # `default-days` only. GitHub rejects the `semver-*` keys for this ecosystem --
      # "not supported for the package ecosystem 'github-actions'" -- and an invalid key
      # here does not degrade gracefully: it invalidates the file and drops this whole
      # entry, grouping included. Nothing local catches that. The published schema admits
      # the key in a cooldown block generally and the ecosystem restriction is enforced
      # server-side, so the file lints clean and fails in the Dependabot tab.
      #
      # One number therefore covers every actions update, which is the right net anyway:
      # these packages execute with this repository's own token inside jobs holding
      # contents and pull-requests write, and a patch is not safer than a major when the
      # risk is a compromised publisher rather than a changed interface.
      default-days: 30
