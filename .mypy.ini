# This file overrides any [tool.mypy] in pyproject.toml rather than merging with it.

[mypy]
# Lets tests/ import the src-layout package without a build.
mypy_path = src
# mypy can't read notebooks; ruff lints them.
exclude = (\.ipynb$|^checks/)
# The floor, matching `target-version` in .ruff.toml.
python_version = 3.10
strict = True
