---
# `make develop` installs these; conventional-merge-commit runs at prepare-commit-msg.
default_install_hook_types: [pre-commit, commit-msg, prepare-commit-msg]

ci:
  # Owns hook bumps because it can't be switched off; dependabot.yml skips pre-commit.
  # Monthly, as the only soak before bot-automerge.yml lands a bump unattended.
  autoupdate_schedule: monthly
  # Both become the squash subject on main, which gitlint never checks.
  autoupdate_commit_msg: 'chore: update pre-commit hook revisions'
  autofix_commit_msg: 'style: apply pre-commit autofixes'
  # pre-commit.ci's image has no uv for the local hook; CI's hook job covers it.
  # CI's rust-lint job runs the cargo pair at Cargo.toml's rust-version floor.
  # tombi needs the network for its schema catalog; CI's `pre-commit` job runs it.
  skip: [unwrap-markdown-prose-py, cargo-fmt, cargo-clippy, tombi-format, tombi-lint]

# The corpus holds fixtures no hook may tidy, this repository's own unwrap included.
# .markdownlintignore, .markdownlint-cli2.jsonc and .unwrapignore repeat this rule.
exclude: ^corpus/[^/]+/

repos:
  # This repository's own hook, run on its own prose.
  - repo: local
    hooks:
      - id: unwrap-markdown-prose-py
        name: unwrap Markdown prose
        entry: uv run unwrap-markdown-prose-py --write
        language: system
        types: [markdown]
        pass_filenames: true

  # The only ruff pin: `make tidy` and CI's `pre-commit` job both run ruff from here.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      # Adds the benchmark notebook, which ruff reads natively and mypy excludes.
      - id: ruff-check
        types_or: [python, pyi, jupyter]
        args: [--fix]
      - id: ruff-format
        types_or: [python, pyi, jupyter]

  # Not redundant with ruff: a blanket `# noqa` or `# type: ignore` silences ruff and mypy.
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-check-blanket-noqa
      - id: python-check-blanket-type-ignore
      - id: python-no-log-warn
      - id: python-use-type-annotations

  # The commands `make rust-lint` runs; both act on the whole crate, so no file names.
  - repo: local
    hooks:
      - id: cargo-fmt
        name: format Rust
        entry: cargo fmt
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: lint Rust
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

  # Single quotes in YAML and JSON, to match `quote-style` in .ruff.toml.
  # `.prettierrc` leaves width to .editorconfig and line endings to .gitattributes.
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.9
    hooks:
      - id: prettier
        types_or: [json, yaml]

  # pyproject-fmt owns pyproject.toml; tombi.toml keeps tombi's formatter off it.
  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: v2.30.3
    hooks:
      - id: pyproject-fmt
        # pyproject-fmt needs Python 3.11+; `make tidy` runs from the 3.10 venv.
        language_version: python3.13

  - repo: https://github.com/tombi-toml/tombi-pre-commit
    rev: v1.9.6
    hooks:
      - id: tombi-format
      - id: tombi-lint

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      # Keeps the two trailing spaces of a Markdown hard break, which the tool honors.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        args: [--config, .markdownlint.yml]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  # These check what yamllint can't: workflow semantics and the shell inside them.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      # Shellchecks `run:` blocks only with shellcheck on PATH, which CI's job ensures.
      - id: actionlint

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck

  # An exclusion here should name the GitHub feature schemastore lacks.
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.2
    hooks:
      - id: check-dependabot
      - id: check-github-workflows

  - repo: https://github.com/crate-ci/typos
    rev: typos-dict-v0.14.2
    hooks:
      - id: typos
        args: [--config, _typos.toml]
        # Repeats _typos.toml's extend-exclude, which explicit file lists bypass.
        exclude: ^(\.gitignore|docs/.*\.svg)$

  # Adds the dialect dictionary typos lacks; .codespellrc holds its settings.
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        # Types for the tests; the package has no runtime dependencies. Unpinned:
        # no bot would bump a pin here, and uv.lock picks the pytest that runs.
        additional_dependencies: [pytest, types-PyYAML]
        args: [--config-file=pyproject.toml]

  # Above gitlint: commit-msg hooks run in order, so gitlint sees the added scope.
  - repo: https://github.com/michen00/custom-commit-hooks
    rev: v0.1.2
    hooks:
      # Scopes a single-file commit's subject only if it still fits in 50 characters.
      - id: enhance-scope
        stages: [commit-msg]
      # Rewrites Git's Merge and Revert subjects as Conventional Commits.
      - id: conventional-merge-commit
        stages: [prepare-commit-msg]

  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks:
      - id: gitlint
