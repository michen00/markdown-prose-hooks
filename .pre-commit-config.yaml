---
default_install_hook_types: [pre-commit, commit-msg, prepare-commit-msg]

ci:
  autoupdate_schedule: monthly
  autoupdate_commit_msg: 'chore: update pre-commit hook revisions'
  autofix_commit_msg: 'style: apply pre-commit autofixes'
  skip: [unwrap-markdown-prose-py, cargo-fmt, cargo-clippy, tombi-format, tombi-lint]

exclude: ^corpus/[^/]+/

repos:
  - repo: local
    hooks:
      - id: unwrap-markdown-prose-py
        name: unwrap Markdown prose
        entry: uv run unwrap-markdown-prose-py --write
        language: system
        types: [markdown]
        pass_filenames: true

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        types_or: [python, pyi, jupyter]
        args: [--fix]
      - id: ruff-format
        types_or: [python, pyi, jupyter]

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-check-blanket-noqa
      - id: python-check-blanket-type-ignore
      - id: python-no-log-warn
      - id: python-use-type-annotations

  - repo: local
    hooks:
      - id: cargo-fmt
        name: format Rust
        entry: cargo fmt
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: lint Rust
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

  # `.prettierrc` leaves width to .editorconfig and line endings to .gitattributes.
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.9
    hooks:
      - id: prettier
        types_or: [json, yaml]

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: v2.30.3
    hooks:
      - id: pyproject-fmt
        # pyproject-fmt needs Python 3.11+; `make tidy` runs from the 3.10 venv.
        language_version: python3.13

  - repo: https://github.com/tombi-toml/tombi-pre-commit
    rev: v1.9.6
    hooks:
      - id: tombi-format
      - id: tombi-lint

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      # Keeps the two trailing spaces of a Markdown hard break, which the tool honors.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        args: [--config, .markdownlint.yml]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.2
    hooks:
      - id: check-dependabot
      - id: check-github-workflows

  - repo: https://github.com/crate-ci/typos
    rev: typos-dict-v0.14.2
    hooks:
      - id: typos
        args: [--config, _typos.toml]
        # Repeats _typos.toml's extend-exclude, which explicit file lists bypass.
        exclude: ^(\.gitignore|docs/.*\.svg)$

  # Adds the dialect dictionary typos lacks; .codespellrc holds its settings.
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        # Types for the tests; the package has no runtime dependencies.
        additional_dependencies: [pytest, types-PyYAML]
        args: [--config-file=pyproject.toml]

  # Above gitlint: commit-msg hooks run in order, so gitlint sees the added scope.
  - repo: https://github.com/michen00/custom-commit-hooks
    rev: v0.1.2
    hooks:
      # Scopes a single-file commit's subject only if it still fits in 50 characters.
      - id: enhance-scope
        stages: [commit-msg]
      # Rewrites Git's Merge and Revert subjects as Conventional Commits.
      - id: conventional-merge-commit
        stages: [prepare-commit-msg]

  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks:
      - id: gitlint
