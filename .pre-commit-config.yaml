---
default_install_hook_types: [pre-commit, commit-msg]

ci:
  # pre-commit.ci owns hook bumps, and that is settled by what it can be told
  # rather than by preference: `autoupdate_schedule` takes only weekly, monthly
  # or quarterly, so there is no way to stand it down and hand the job to
  # Dependabot. Since it raises these pull requests whatever else is configured,
  # .github/dependabot.yml deliberately carries no `pre-commit` ecosystem. Two
  # bots opening the same bump is the failure mode, and this is the half that
  # cannot be switched off.
  #
  # Monthly rather than the weekly default: these are pinned `rev:` tags on
  # linters, and bot-automerge.yml arms them unattended, so the cadence is the
  # only soak period between an upstream tag moving and it landing here.
  autoupdate_schedule: monthly
  # Both messages become the pull request title, which becomes the squash
  # subject on `main`. Left at the defaults they arrive as `[pre-commit.ci]
  # pre-commit autoupdate`, which is the one commit subject reaching this
  # repository that gitlint never sees: it runs at `commit-msg` on a machine,
  # and a squash message is composed on GitHub. Dependabot needs no equivalent
  # -- it detects the convention and already writes `build(deps): ...`.
  autoupdate_commit_msg: 'chore: update pre-commit hook revisions'
  autofix_commit_msg: 'style: apply pre-commit autofixes'
  # This repository's own hook is `entry: uv run ...` under `language: system`,
  # and pre-commit.ci's image carries no `uv`, so the hook cannot resolve there --
  # it fails with "Executable `uv` not found" rather than with anything about
  # Markdown. CI's `hook` job is what covers it, against a real install and
  # through the framework the way a consumer resolves it.
  #
  # The cargo pair is held out for that reason and for one of its own. CI's
  # `rust-lint` job pins the toolchain to the `rust-version` floor in Cargo.toml
  # on purpose, so a language feature newer than the floor fails there rather
  # than in a consumer's `cargo install`. A second run against whatever
  # toolchain this image happens to carry would answer a different question, and
  # the pinned one is the question worth asking.
  skip: [unwrap-markdown-prose-py, cargo-fmt, cargo-clippy]

# The conformance corpus is bytes, not prose. Its inputs are deliberately
# malformed or deliberately CRLF, and two of its cases exist precisely to pin
# behavior that a tidying hook destroys: a GFM hard break is two trailing
# spaces, and a CRLF case stops being one the moment line endings are
# normalized. Worst of all, this repository runs its own unwrap hook over
# `types: [markdown]`, which would rewrite every `input.md` into its own
# expected output and turn the whole suite green against nothing.
#
# Any tier, not `cases` alone, so a second one arrives already covered -- which
# `corpus/cli/` promptly was. One rule, spelled once per engine that cannot read
# another's dialect: this key for the hooks below, .markdownlintignore for
# markdownlint-cli, .markdownlint-cli2.jsonc for cli2 and the editor because cli2 reads
# no ignore file at all, and .unwrapignore for the unwrap itself.
#
# There was a fifth, .github/scripts/list-prose.sh, which existed only because the tool
# had no exclusion of its own and so could not be told anything by try-repo (which builds
# its config from a mirror's manifest) or by the action (which sweeps with its own
# `git ls-files`). .unwrapignore reaches both, so the script is gone. This key still
# earns its place: it holds the corpus back from the *other* hooks here, which know
# nothing about .unwrapignore and would normalize a CRLF fixture or eat a hard break's
# trailing spaces. `corpus/README.md` is prose about the corpus and stays in scope.
exclude: ^corpus/[^/]+/

repos:
  # This repository runs its own hook against itself. A tool that reformats prose
  # and is not subjected to its own output is one nobody has read the output of.
  - repo: local
    hooks:
      - id: unwrap-markdown-prose-py
        name: unwrap Markdown prose
        entry: uv run unwrap-markdown-prose-py --write
        language: system
        types: [markdown]
        pass_filenames: true

  # Held level with the `ruff` in `dependency-groups`, which is what `make
  # check` runs. They had drifted two minor versions apart, so the hook and the
  # gate were answering with different rule sets -- a selector this config uses
  # does not exist in the older one, which is how the drift surfaced.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      # `types_or` because the default reaches .py alone, and the benchmark
      # notebook is source too. ruff reads the notebook format natively, which
      # is what lets it be linted at all -- mypy cannot, and excludes it.
      - id: ruff-check
        types_or: [python, pyi, jupyter]
        args: [--fix]
      - id: ruff-format
        types_or: [python, pyi, jupyter]

  # The Rust half of what `make rust-lint` and CI's `rust-lint` job already run,
  # spelled with the same commands so there is one definition of the check and
  # not three. rustfmt writes and clippy reports, which is the split the ruff
  # pair above has: `ruff-format` rewrites, `ruff-check` gates.
  #
  # `language: system` because both ship with the toolchain. A `language: rust`
  # hook would `cargo install` something in order to run cargo, and a repository
  # holding a crate has cargo by construction.
  #
  # `pass_filenames: false` because neither tool takes a file list: clippy
  # compiles the crate, and `cargo fmt` reads the crate's own targets. `types:
  # [rust]` still gates the pair, so a commit that touches no `.rs` file does
  # not run either of them.
  - repo: local
    hooks:
      - id: cargo-fmt
        name: format Rust
        entry: cargo fmt
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: lint Rust
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

  # Single quotes in YAML and JSON, to match `quote-style` in .ruff.toml.
  # `.prettierrc` deliberately holds less than the shared one this repository
  # borrows from: `printWidth: 88` pulls the first line of a folded `description:`
  # scalar up onto the key line in `action.yml` and the mirror manifests, and
  # `endOfLine: auto` would let a rewrite decide line endings in a repository
  # that pins them in .gitattributes and tests CRLF on Windows.
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.5
    hooks:
      - id: prettier
        types_or: [json, yaml]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.45.0
    hooks:
      - id: markdownlint
        args: [--config, .markdownlint.yml]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
        args: [--strict]

  # yamllint above judges these files as YAML; none of the three below judge
  # them as YAML at all. A workflow can be well-formed and still name a
  # `runs-on` that does not exist, misspell a context, or carry shell that
  # cannot run, and the only place that showed up before was a red run.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      # Checks the Actions schema and the `${{ }}` expressions. It also hands
      # every `run:` block to shellcheck, but only when a shellcheck binary is
      # on PATH, and this hook's own environment does not carry one: `language:
      # golang` isolates it, and the shellcheck hook below installs into a
      # separate virtualenv that is never on this hook's PATH. So the embedded
      # shell is checked here only on a machine that happens to have shellcheck
      # installed, and silently is not on one that does not -- a broken `run:`
      # block passes. `lint` in CI is what makes that coverage real: the Ubuntu
      # runner ships shellcheck, so the delegation happens there on every push.
      # The hook below is still not redundant with this one, but for a narrower
      # reason than the delegation: it reaches the script on disk.
      - id: actionlint

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  # The workflow schema rather than the workflow: schemastore knows which keys
  # GitHub accepts, which actionlint's own checks and a YAML parser both miss.
  # Exclusions belong here when schemastore lags a real GitHub feature, and
  # each one should say which feature and when it can go.
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.37.4
    hooks:
      - id: check-dependabot
      - id: check-github-workflows

  - repo: https://github.com/crate-ci/typos
    rev: v1.38.1
    hooks:
      - id: typos
        args: [--config, _typos.toml]
        # `_typos.toml` already lists .gitignore under `[files] extend-exclude`,
        # but that governs the tool's own file discovery and pre-commit hands it
        # an explicit list instead, which bypasses it. The exclusion has to be
        # repeated here to take effect. .gitignore is generated by concatenating
        # community templates, so its .NET boilerplate — package-manager names
        # and publish-target globs — is not ours to correct.
        exclude: ^\.gitignore$

  # Sits alongside typos rather than replacing it, and the split is not arbitrary:
  # typos splits identifiers and gates misspellings, codespell adds the dialect
  # dictionary typos has no equivalent for. Argument-free on purpose -- everything is in
  # .codespellrc, including why there is no `exclude:` here to mirror the typos hook's.
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell

  # The annotations in this repository were documentation until now: nothing
  # read them, so a wrong one cost nothing and stayed. Configured in
  # pyproject.toml, keyed to the 3.10 floor there for the reason ruff's
  # target-version is keyed to it.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        # pytest alone, where a project with runtime dependencies would list
        # every one: this package's `dependencies` is empty and stays that way,
        # so the only third-party types in the tree are the fixtures the tests
        # take. `--config-file` because the hook does not pass one, and mypy
        # would otherwise run with its own defaults rather than the strict
        # settings the file sets.
        additional_dependencies: [pytest]
        args: [--config-file=pyproject.toml]

  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks:
      - id: gitlint
