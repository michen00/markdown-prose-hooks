---
default_install_hook_types: [pre-commit, commit-msg]

ci:
  # pre-commit.ci owns hook bumps, and that is settled by what it can be told
  # rather than by preference: `autoupdate_schedule` takes only weekly, monthly
  # or quarterly, so there is no way to stand it down and hand the job to
  # Dependabot. Since it raises these pull requests whatever else is configured,
  # .github/dependabot.yml deliberately carries no `pre-commit` ecosystem. Two
  # bots opening the same bump is the failure mode, and this is the half that
  # cannot be switched off.
  #
  # Monthly rather than the weekly default: these are pinned `rev:` tags on
  # linters, and bot-automerge.yml arms them unattended, so the cadence is the
  # only soak period between an upstream tag moving and it landing here.
  autoupdate_schedule: monthly
  # This repository's own hook is `entry: uv run ...` under `language: system`,
  # and pre-commit.ci's image carries no `uv`, so the hook cannot resolve there --
  # it fails with "Executable `uv` not found" rather than with anything about
  # Markdown. CI's `hook` job is what covers it, against a real install and
  # through the framework the way a consumer resolves it.
  skip: [unwrap-markdown-prose]

# The conformance corpus is bytes, not prose. Its inputs are deliberately
# malformed or deliberately CRLF, and two of its cases exist precisely to pin
# behavior that a tidying hook destroys: a GFM hard break is two trailing
# spaces, and a CRLF case stops being one the moment line endings are
# normalized. Worst of all, this repository runs its own unwrap hook over
# `types: [markdown]`, which would rewrite every `input.md` into its own
# expected output and turn the whole suite green against nothing.
#
# Any tier, not `cases` alone, so a second one arrives already covered. This is the
# third place the same exclusion is spelled -- .markdownlintignore covers the two
# markdownlint engines, .github/scripts/list-prose.sh covers the two CI callers this
# key cannot reach -- and they are kept to one shape deliberately. `corpus/README.md`
# is prose about the corpus and stays in scope for all three.
exclude: ^corpus/[^/]+/

repos:
  # This repository runs its own hook against itself. A tool that reformats prose
  # and is not subjected to its own output is one nobody has read the output of.
  - repo: local
    hooks:
      - id: unwrap-markdown-prose
        name: unwrap Markdown prose
        entry: uv run unwrap-markdown-prose --write
        language: system
        types: [markdown]
        pass_filenames: true

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Single quotes in YAML and JSON, to match `quote-style` in pyproject.toml.
  # `.prettierrc` deliberately holds less than the shared one this repository
  # borrows from: `printWidth: 88` pulls the first line of a folded `description:`
  # scalar up onto the key line in `action.yml` and `.pre-commit-hooks.yaml`, and
  # `endOfLine: auto` would let a rewrite decide line endings in a repository
  # that pins them in .gitattributes and tests CRLF on Windows.
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.5
    hooks:
      - id: prettier
        types_or: [json, yaml]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.45.0
    hooks:
      - id: markdownlint
        args: [--config, .markdownlint.yml]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
        args: [--strict]

  - repo: https://github.com/crate-ci/typos
    rev: v1.38.1
    hooks:
      - id: typos
        args: [--config, _typos.toml]
        # `_typos.toml` already lists .gitignore under `[files] extend-exclude`,
        # but that governs the tool's own file discovery and pre-commit hands it
        # an explicit list instead, which bypasses it. The exclusion has to be
        # repeated here to take effect. .gitignore is generated by concatenating
        # community templates, so its .NET boilerplate — package-manager names
        # and publish-target globs — is not ours to correct.
        exclude: ^\.gitignore$

  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks:
      - id: gitlint
