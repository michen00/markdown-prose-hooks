---
# Four ids, two implementations, one corpus. The `-py` pair is the recommended
# default through `pre-commit`: the framework is itself a Python application, so
# every consumer already has an interpreter, while a `language: rust` hook builds
# from source and a consumer without cargo pays a full toolchain download first.
# The `-rs` pair is offered rather than recommended, and its audience is a
# repository that already has cargo.
#
# The suffixes are not decoration. Both implementations answer to the same
# corpus, so a repository can switch between them and get the same bytes; naming
# them apart is what makes that a choice rather than a coincidence.
#
# DEVIATION, blocked on the mirror repositories. This file is meant to go
# away. At
# `v0.1.0` each pair moves to a mirror repository serving only its own
# implementation -- `markdown-prose-hooks-py` and `markdown-prose-hooks-rs` --
# so a consumer stops cloning roughly 1.4 MB carrying both plus 373 corpus
# fixtures and the benchmark notebook to get one of them. The `-rs` mirror is a
# thin wrapper crate depending on the published crate, which is why it could
# not be built before the first release put that crate on the registry. It is
# there now, so this waits on the generator rather than on a tag.
#
# The ids do not change; the `repo:` URL does, which is a configuration edit
# for a consumer rather than a `rev` bump. That is why it happens inside the
# `0.0.x` series, while nobody is pinned and it costs nothing.
- id: unwrap-markdown-prose-py
  name: unwrap Markdown prose (Python)
  description:
    Join manual soft-wrap line breaks in Markdown prose, leaving code fences,
    tables, lists, front matter, hard breaks, and label rows untouched.
  entry: unwrap-markdown-prose-py --write
  language: python
  types: [markdown]
  stages: [pre-commit]

- id: unwrap-markdown-prose-py-check
  name: check Markdown prose is unwrapped (Python)
  description:
    Report Markdown prose carrying manual soft-wrap line breaks without
    rewriting anything. For repositories that want the signal, not the edit.
  entry: unwrap-markdown-prose-py --fail-on-change
  language: python
  types: [markdown]
  stages: [pre-commit]

- id: unwrap-markdown-prose-rs
  name: unwrap Markdown prose (Rust)
  description:
    Join manual soft-wrap line breaks in Markdown prose, leaving code fences,
    tables, lists, front matter, hard breaks, and label rows untouched.
  entry: unwrap-markdown-prose-rs --write
  language: rust
  types: [markdown]
  stages: [pre-commit]

- id: unwrap-markdown-prose-rs-check
  name: check Markdown prose is unwrapped (Rust)
  description:
    Report Markdown prose carrying manual soft-wrap line breaks without
    rewriting anything. For repositories that want the signal, not the edit.
  entry: unwrap-markdown-prose-rs --fail-on-change
  language: rust
  types: [markdown]
  stages: [pre-commit]
