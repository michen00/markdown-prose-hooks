[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[project]
name = 'markdown-prose-hooks'
version = '0.0.0'
description = 'Pre-commit hooks that reflow Markdown prose to one line per paragraph.'
readme = 'README.md'
license = { file = 'LICENSE' }
authors = [{ name = 'Michael I Chen' }]
keywords = ['pre-commit', 'markdown', 'formatter', 'prose', 'linter']
# 3.10 is the real floor: `dataclass(slots=True)`. Nothing here reaches past
# it — the one 3.13-only call, `Path.read_text(newline=...)`, is deliberately
# spelled `Path.open(...)` instead, because a hook cannot impose an interpreter
# on the repositories that install it.
requires-python = '>=3.10'
dependencies = []
classifiers = [
  'Development Status :: 4 - Beta',
  'Environment :: Console',
  'Intended Audience :: Developers',
  'License :: OSI Approved :: MIT License',
  'Programming Language :: Python :: 3 :: Only',
  'Programming Language :: Python :: 3.10',
  'Programming Language :: Python :: 3.11',
  'Programming Language :: Python :: 3.12',
  'Programming Language :: Python :: 3.13',
  'Topic :: Software Development :: Quality Assurance',
  'Topic :: Text Processing :: Markup :: Markdown',
]

[project.urls]
Homepage = 'https://github.com/michen00/markdown-prose-hooks'
Issues = 'https://github.com/michen00/markdown-prose-hooks/issues'

[project.scripts]
unwrap-markdown-prose = 'markdown_prose_hooks.unwrap:main'

[dependency-groups]
dev = ['pytest>=8', 'pytest-cov>=5', 'ruff>=0.16.2']

[tool.hatch.build.targets.wheel]
packages = ['src/markdown_prose_hooks']

[tool.pytest.ini_options]
testpaths = ['tests']
addopts = '--strict-markers'

[tool.coverage.run]
source = ['src/markdown_prose_hooks']

[tool.ruff]
line-length = 88
# The floor, not the interpreter used to develop: pyupgrade rewrites to the
# oldest supported syntax, so a higher value here would emit code the hook
# cannot run on the repositories that install it.
target-version = 'py310'
src = ['src', 'tests']
# Ruff formats Python fenced in Markdown. Every .md here is prose, a plan, or
# a byte-exact corpus fixture -- none of it ships as source, and a fixture that
# a formatter rewrites is a suite green against nothing.
extend-exclude = ['*.md']

[tool.ruff.lint]
# Kept as the source repository holds it: one family per line, sorted by code,
# each carrying the reason it is on, so adding or dropping one is a one-line
# diff that `git blame` lands on.
select = [
  'B',   # flake8-bugbear: likely bugs and questionable constructs
  'E',   # pycodestyle: the layout questions the formatter does not settle
  'ERA', # eradicate: commented-out code
  'F',   # Pyflakes: unused imports, undefined names
  'I',   # isort: import ordering
  'UP',  # pyupgrade: syntax superseded by target-version
]

[tool.ruff.format]
quote-style = 'single'
