[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "markdown-prose-hooks"
version = "0.5.2"
description = "Pre-commit hooks that reflow Markdown prose to one line per paragraph."
readme = "README.md"
keywords = [ "formatter", "linter", "markdown", "pre-commit", "prose" ]
license = "MIT"
license-files = [ "LICENSE" ]
authors = [ { name = "Michael I Chen" } ]
# The floor is `dataclass(slots=True)`; a hook can't choose its consumers' Python.
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = []
urls.Homepage = "https://github.com/michen00/markdown-prose-hooks"
urls.Issues = "https://github.com/michen00/markdown-prose-hooks/issues"
scripts.unwrap-markdown-prose-py = "markdown_prose_hooks.unwrap:main"

[dependency-groups]
# `jupyter` and `matplotlib` serve the notebooks in docs/.
dev = [
  "jupyter>=1.1",
  # Static charts, because GitHub's notebook view runs no JavaScript.
  "matplotlib>=3.9",
  # So `make tidy` doesn't run whichever pre-commit is first on PATH.
  "pre-commit>=4",
  # The first release that reads pytest.toml.
  "pytest>=9",
  "pytest-cov>=5",
  "pyyaml>=6",
]

[tool.hatch]
build.targets.wheel.packages = [ "src/markdown_prose_hooks" ]

[tool.pyproject-fmt]
# The newest Python CI tests.
max_supported_python = "3.14"

[tool.mypy]
# Lets tests/ import the src-layout package without a build.
mypy_path = "src"
# mypy can't read notebooks; ruff lints them.
exclude = '(\.ipynb$|^checks/)'
# The floor, matching `target-version` in .ruff.toml.
python_version = "3.10"
strict = true
