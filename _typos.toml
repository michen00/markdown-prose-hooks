[default]
extend-ignore-re = ['(?Rm)^.*(#|/)\s*spellchecker:disable-line$']
# `Nd` is the Unicode decimal-digit category; `CPY` is Ruff's copyright rule prefix.
extend-ignore-words-re = ['arange', 'CPY', 'Nd']

# Matplotlib's SVG clip-path IDs are hashes that change every run and can read as typos.
[files]
extend-exclude = ['.gitignore', 'CHANGELOG.md', 'docs/**/*.svg']
