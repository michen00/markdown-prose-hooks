# This file overrides any [tool.ruff] in pyproject.toml rather than merging with it.

line-length = 88
indent-width = 4
# The oldest supported Python, so pyupgrade emits nothing a consumer can't run.
target-version = 'py310'
src = ['src', 'tests']
# Markdown here is prose or byte-exact corpus fixtures; checks/ is vendored as-is.
extend-exclude = ['*.md', 'checks']

[lint]
select = ['ALL']
ignore = [
  'COM812',  # missing-trailing-comma: conflicts with the formatter
  'CPY001',  # missing-copyright-notice
  'PLR2004',  # magic-value-comparison
  'TD002',  # missing-todo-author
  'TD003',  # missing-todo-link
  # The tool's subject is Unicode text, Arabic-Indic list markers included.
  'RUF001',  # ambiguous-unicode-character-string
  'RUF002',  # ambiguous-unicode-character-docstring
  'RUF003',  # ambiguous-unicode-character-comment
]
# The google convention turns D401 (imperative mood) off; this repository wants it.
extend-select = ['D401']
fixable = ['ALL']
unfixable = []
dummy-variable-rgx = '^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$'

[lint.flake8-quotes]
inline-quotes = 'single'

[lint.mccabe]
max-complexity = 15

[lint.pydocstyle]
convention = 'google'

[lint.pylint]
max-branches = 15
max-returns = 10

[lint.per-file-ignores]
'docs/*.ipynb' = [
  'S101',  # assert: narrows a type in a cell rather than testing
  'T201',  # print: what a notebook cell produces
  'S603',  # subprocess-without-shell-equals-true: it times two fixed binaries
  'S607',  # start-process-with-partial-path
  'S108',  # hardcoded-temp-file: a scratch path for a timed run
  'TRY003',  # raise-vanilla-args
  'EM102',  # f-string-in-exception
  # Fix these when the notebook is next re-executed, so its output stays current.
  'A004',  # builtin-import-shadowing
  'ISC004',  # explicit-string-concatenation in a collection
]
'tests/*.py' = [
  'S101',  # assert: what a test is written with
  'D401',  # non-imperative-mood: a test docstring states what holds
]
# Command-line maintenance scripts.
'scripts/*.py' = [
  'T201',  # print: the output of a command-line script
  'TRY003',  # raise-vanilla-args
  'EM101',  # raw-string-in-exception
  'EM102',  # f-string-in-exception
  'S603',  # subprocess-without-shell-equals-true: fixed argv, no user input
  'S607',  # start-process-with-partial-path: git and gh come off PATH
  'S310',  # suspicious-url-open-usage: a fixed API host
  'EXE001',  # shebang-not-executable: run through the interpreter, not directly
]

[format]
quote-style = 'single'
indent-style = 'space'
skip-magic-trailing-comma = false
line-ending = 'auto'
docstring-code-format = true
docstring-code-line-length = 'dynamic'
