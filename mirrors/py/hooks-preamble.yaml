# The two Python hook ids, and nothing else. A consumer of these clones this
# repository, so everything not needed to build and run them is weight charged
# to them for no benefit -- which is the whole reason this repository exists
# apart from michen00/markdown-prose-hooks.
#
# `pre-commit` installs a `language: python` hook with `pip install .` against
# the clone, and the package declares no dependencies, so these two ids resolve
# from this tree alone and reach no registry.
