---
# The two Python hook ids, and nothing else. A consumer of these clones this
# repository, so everything not needed to build and run them is weight charged
# to them for no benefit -- which is the whole reason this repository exists
# apart from michen00/markdown-prose-hooks.
#
# `pre-commit` installs a `language: python` hook with `pip install .` against
# the clone, and the package declares no dependencies, so these two ids resolve
# their own code from this tree rather than from a registry. The build is the
# exception: `pip install .` builds in isolation, so `hatchling` and what it
# needs come from an index, and the install reaches one even though the run
# does not.
#
# Generated. Edits belong upstream: this tree is replaced wholesale, never
# merged.
- id: unwrap-markdown-prose-py
  name: unwrap Markdown prose (Python)
  description:
    Join manual soft-wrap line breaks in Markdown prose, leaving code fences,
    tables, lists, front matter, hard breaks, and label rows untouched.
  entry: unwrap-markdown-prose-py --write
  language: python
  types: [markdown]
  stages: [pre-commit]

- id: unwrap-markdown-prose-py-check
  name: check Markdown prose is unwrapped (Python)
  description:
    Report Markdown prose carrying manual soft-wrap line breaks without
    rewriting anything. For repositories that want the signal, not the edit.
  entry: unwrap-markdown-prose-py --fail-on-change
  language: python
  types: [markdown]
  stages: [pre-commit]
