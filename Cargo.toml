[package]
name = 'markdown-prose-hooks'
# Kept equal to pyproject.toml's.
version = '0.5.2'
authors = ['Michael I Chen']
edition = '2024'
# What the gating CI jobs install; edition 2024 needs only 1.85.
rust-version = '1.86'
description = 'Pre-commit hooks that reflow Markdown prose to one line per paragraph.'
readme = 'README.md'
license = 'MIT'
repository = 'https://github.com/michen00/markdown-prose-hooks'
keywords = ['formatter', 'linter', 'markdown', 'pre-commit', 'prose']
categories = ['command-line-utilities', 'text-processing']

# Only what the crate builds from. `/src/*.rs` leaves out the Python package in
# src/; tests/ and corpus/ stay out together, since the tests read the corpus.
include = [
  '/LICENSE',
  '/README.md',
  # [lints.clippy] ships, and its pedantic group needs this config to pass.
  '/clippy.toml',
  '/src/*.rs',
  '/src/bin/*.rs',
]

[lints.clippy]
# Here rather than as a flag, so every clippy caller reads it. `priority = -1`
# lets the lints below override the group.
pedantic = { level = 'warn', priority = -1 }
# `argv` and `args` are both the right names.
similar_names = 'allow'

# Keeps the binary near 1 MB. Test and bench profiles ignore `panic`.
[profile.release]
opt-level = 'z'
strip = true
lto = true
panic = 'abort'
codegen-units = 1
